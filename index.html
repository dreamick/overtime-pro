/* ------------------------- 明细视图 ------------------------- */
function viewList() {
  const n = daysIn(cur), mo = M(cur);
  // 上月结转视图：cur 已跳到「上一月」，反推该月哪些加班日实际构成了「下月结转来源」
  // 口径与 compute 内部 prevRemain 归属一致：按 工作日→双休日→节假日 类型顺序，同类型内按日期降序（FIFO 下剩余的是较晚加班）
  let carryInShow = null;   // d → 该日加班时长中被结转给下月的部分
  if (carryInView) {
    const nk = nextKey(cur);
    const nx = DB.months[nk] ? compute(nk) : null;
    if (nx && nx.carryInTotal > 0.001) {
      const order = ['work', 'rest', 'holi'];
      const capByT = { work: nx.carryIn.work, rest: nx.carryIn.rest, holi: nx.carryIn.holi };
      carryInShow = {};
      order.forEach(t => {
        let cap = capByT[t];
        for (let d = n; d >= 1 && cap > 0.001; d--) {
          if (dayType(cur, d) !== t) continue;
          const h = hoursOf(cur, d); if (h <= 0) continue;
          const take = Math.min(h, cap);
          carryInShow[d] = +((carryInShow[d] || 0) + take).toFixed(2);
          cap = +(cap - take).toFixed(2);
        }
      });
    }
  }
  // 结转下月筛选：按 FIFO 把结转时长归属到具体加班日
  // （换休先消耗上月结转，再按 工作日→双休日→节假日 消耗本月新增；同类型内先产生先被消耗 → 结转归属到较晚的加班日）
  let carryShow = null;   // d → 该日加班时长中结转下月的部分
  if (listFilter === 'carry') {
    const cc = compute(cur);
    const order = ['work', 'rest', 'holi'];
    let need = cc.leaveTotal;
    const carried = {};
    order.forEach(t => {
      const uPrev = Math.min(need, cc.carryIn[t]); need -= uPrev;   // 换休先消耗上月结转
      const uCur = Math.min(need, cc.gain[t]); need -= uCur;        // 再消耗本月新增
      carried[t] = +Math.min(cc.carryOut[t], Math.max(0, cc.gain[t] - uCur)).toFixed(2);
    });
    carryShow = {};
    order.forEach(t => {
      let rem = carried[t];
      for (let d = n; d >= 1 && rem > 0.001; d--) {
        if (dayType(cur, d) !== t) continue;
        const h = hoursOf(cur, d); if (h <= 0) continue;
        const take = Math.min(h, rem);
        carryShow[d] = +((carryShow[d] || 0) + take).toFixed(2);
        rem = +(rem - take).toFixed(2);
      }
    });
  }
  let rows = '';
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d] || {}, t = dayType(cur, d), T = TYPES.find(x => x.k === t);
    const [y, m] = cur.split('-').map(Number);
    const w = WD[new Date(y, m - 1, d).getDay()];
    const isWork = t === 'work';
    const startDef = isWork ? '17:00' : '10:00';
    const theStart = r.start || startDef;
    const endDef = addHour(theStart, 1);                 // 结束默认 = 开始 + 1 小时
    const auto = autoHours(r.start, r.end);
    const manual = r.hours !== undefined && r.hours !== null && r.hours !== '';
    const hasAuto = auto !== null && !!r.start && !!r.end && auto >= 1;   // 时长按开始/结束自动统计，1 小时起
    const effH = manual ? (+r.hours || 0) : (auto !== null ? auto : 0);
    const mealCnt = isWork ? (effH >= 1.5 ? 1 : 0) : (+r.meal || 0);
    const mealCell = isWork
      ? `<td class="center"><span class="auto-badge${mealCnt ? '' : ' zero'}" title="工作日加班≥1.5h 自动计 1 次餐补">${mealCnt ? '🍚 1' : '—'}</span></td>`
      : `<td class="center"><span class="auto-badge meal-toggle${mealCnt ? '' : ' zero'}" data-f="meal" role="button" tabindex="0" title="点击记 1 次餐补，再次点击取消">${mealCnt ? '🍚 1' : '—'}</span></td>`;
    let show = true;
    if (carryInView) show = (carryInShow && (carryInShow[d] || 0) > 0);   // 上月结转来源：仅显示被结转给下月的加班行
    else if (listFilter === 'ot') show = effH > 0;
    else if (listFilter === 'leave') show = (+r.leaveH || 0) > 0 || (+r.annual || 0) > 0 || (+r.outing || 0) > 0;
    else if (listFilter === 'carry') show = (carryShow[d] || 0) > 0;   // 构成本月结转下月时长的加班行
    else if (listFilter === 'meal') show = mealCnt > 0;
    else if (listFilter === 'annual') show = (+r.annual || 0) > 0;
    else if (listFilter === 'cash') show = effH > 0 && t !== 'work';       // 折现：双休/节假日加班行（折现主要来源）
    if (show) rows += `<tr class="${t}${carryInView ? ' carry-in-src' : ''}${isToday(cur, d) ? ' today' : ''}" data-d="${d}"${(carryInView && carryInShow[d]) ? ` title="当日加班 ${hf(effH)}h，其中 ${hf(carryInShow[d])}h 结转至 ${nextKey(cur)}（不折现）"` : (listFilter === 'carry' && carryShow[d] ? ` title="当日加班 ${hf(effH)}h，其中 ${hf(carryShow[d])}h 结转下月（不折现）"` : '')}>
      <td class="dcell"><span class="dn">${d}</span><span class="wk">周${w}</span><span class="tychip ${T.cls}">${T.name}</span></td>
      <td class="center">${timePicker(r.start, 'start', startDef, r.end)}</td>
      <td class="center">${timePicker(r.end, 'end', endDef, r.start)}</td>
      <td class="center"><span class="hcell"><input class="cellin" data-f="hours" type="number" min="1" step="0.5" value="${manual ? esc(r.hours) : (hasAuto ? hf(auto) : '')}" placeholder="${hasAuto ? '' : '—'}" style="width:62px;text-align:center;color:#ea580c;${manual ? 'font-weight:650' : ''}"><span class="hcell-clr" title="清除时长（恢复按开始/结束自动计算）">×</span></span></td>
      <td><span class="rcell"><input class="cellin" data-f="reason" value="${esc(r.reason)}" placeholder="事由" style="min-width:150px"><span class="ca ca-copy" title="复制事由">⧉</span><span class="ca ca-clr" title="清除事由">×</span></span></td>
    <td class="center leave-col">${restPicker(r.leaveH, r.annual, r.outing, isWork)}</td>
      <td><span class="rcell"><input class="cellin lr-${(+r.outing > 0) ? 'ot' : ((+r.annual > 0) ? 'an' : ((+r.leaveH > 0) ? 'lv' : ''))}" data-f="leaveReason" value="${esc(r.leaveReason)}" placeholder="事由" style="min-width:110px"><span class="ca ca-copy" title="复制事由">⧉</span><span class="ca ca-clr" title="清除事由">×</span></span></td>
      ${mealCell}
      <td class="center"><button class="oa-btn ${r.oa ? 'on' : ''}" data-f="oa">${r.oa ? '✅' : '○'}</button></td>
    </tr>`;
  }
  if (carryInView) {
    if (!rows) rows = `<tr><td colspan="9" style="text-align:center;padding:28px;color:var(--tx-3)">${DB.months[nextKey(cur)] ? `下月（${nextKey(cur)}）无结转来源记录` : '无下一月数据'}，<a href="javascript:exitCarryInView()" style="color:var(--brand)">返回本月</a></td></tr>`;
  } else if (listFilter && !rows) rows = `<tr><td colspan="9" style="text-align:center;padding:28px;color:var(--tx-3)">当前筛选条件下无记录，<a href="javascript:setListFilter(null)" style="color:var(--brand)">清除筛选</a></td></tr>`;
  const c = compute(cur);
  const nk = nextKey(cur);
  const nx = DB.months[nk] ? compute(nk) : null;
  let head;
  if (carryInView) {
    const src = nx ? `工 ${hf(nx.carryIn.work)} · 休 ${hf(nx.carryIn.rest)} · 节 ${hf(nx.carryIn.holi)}` : '无';
    head = `<div class="card-h"><h3>${cur.replace('-', ' 年 ')} 月明细 · 结转来源</h3>
      <span class="spacer"></span>
      <span class="carry-in-note">下表为结转至 <b>${nk.replace('-', ' 年 ')} 月</b> 的加班来源（共 ${src}）</span>
      <button class="btn sm" onclick="exitCarryInView()" title="返回当前月份">← 返回 ${nk.replace('-', ' 年 ')} 月</button>
    </div>`;
  } else {
    head = `<div class="card-h"><h3>${cur.replace('-', ' 年 ')} 月明细</h3>
      <span class="spacer"></span>
      <button class="btn sm ot-settle" onclick="openMonthSettle('${cur}')" title="本月加班结算：加班费 / 结转下月 / 换休核销">结算</button>
    </div>`;
  }
  return `<div class="card">
    ${head}
    <div class="dt-wrap"><table class="dt">
      <thead><tr><th class="center" style="min-width:104px">日期</th><th class="center" style="min-width:66px">开始</th><th class="center" style="min-width:66px">结束</th><th class="center" style="min-width:70px;color:#ea580c">时长</th><th style="min-width:150px">加班事由</th><th class="center leave-col" style="min-width:110px">换休·年假·外出</th><th style="min-width:80px">事由</th><th class="center" style="min-width:66px">餐补</th><th class="center" style="min-width:56px">OA</th></tr></thead>
      <tbody id="dtb">${rows}</tbody>
    </table></div>
  </div>`;
}

function bindList() {
  const tb = $('#dtb'); if (!tb) return;
  // 提交单元格数据：rebuild=true 时重建行（失焦/选择），rebuild=false 时仅实时刷新 KPI（输入中）
  function commitCell(el, rebuild) {
    const d = el.closest('tr').dataset.d, f = el.dataset.f;
    const days = M(cur).days, r = days[d] || (days[d] = {});
    let v = (el.value == null ? '' : String(el.value)).trim();
    if (['hours', 'leaveH', 'annual', 'meal'].includes(f)) {
      let num = v === '' ? '' : (+v || 0);
      if (rebuild && f === 'leaveH' && num !== '') {
        // 换休时长不超过本月可用加班总时长（上月结转 + 本月工作日加班）
        const c = compute(cur);
        const budget = c.carryIn.work + c.gain.work;
        let others = 0;
        Object.keys(days).forEach(dd => { if (dd !== d) others += +((days[dd] || {}).leaveH || 0); });
        const maxLeave = Math.max(0, budget - others);
        if (num > maxLeave) { num = maxLeave; el.value = num; toast('换休时长不可超过可用加班总时长 ' + hf(budget) + 'h（本行最多 ' + hf(maxLeave) + 'h）'); }
      }
      if (num === '' || (f === 'leaveH' && num === 0)) delete r[f]; else r[f] = num;
      if (f === 'leaveH' && (num === '' || num === 0)) delete r.leaveSrc;  // 无换休时长则清空对应
    }
    else if (v === '') delete r[f]; else r[f] = v;
    if ((f === 'start' || f === 'end') && r.start && r.end && r.end < r.start) delete r.end;  // 结束不小于开始
    if (!Object.keys(r).length) delete days[d];
    save(); renderKPI();
    if (rebuild) renderBody();
  }
  // 输入中实时刷新 KPI（不重建行，保留焦点）
  tb.addEventListener('input', e => { const el = e.target; if (!el.dataset.f) return; commitCell(el, false); });
  // 失焦/选择完成时提交并重建行
  tb.addEventListener('change', e => { const el = e.target; if (!el.dataset.f) return; commitCell(el, true); });
  tb.addEventListener('click', e => {
    const mt = e.target.closest('.meal-toggle');
    if (mt) {
      const d = mt.closest('tr').dataset.d, days = M(cur).days, r = days[d] || (days[d] = {});
      if (+r.meal > 0) delete r.meal; else r.meal = 1;   // 双休日/节假日餐补：点击记 1，再次点击取消
      save(); renderKPI(); renderBody();
      return;
    }
    const clr = e.target.closest('.hcell-clr');
    if (clr) {
      const d = clr.closest('tr').dataset.d, days = M(cur).days, r = days[d];
      if (!r) return;
      confirmDialog({ title:'清除加班时长', msg:'确定清除本日加班时长吗？清除后将恢复按「开始 / 结束」自动计算。', okText:'清除', danger:true, onOk: () => {
        delete r.hours; if (!Object.keys(r).length) delete days[d];
        save(); renderKPI(); renderBody();
      }});
      return;
    }
    const ca = e.target.closest('.rcell .ca');
    if (ca) {
      const span = ca.closest('.rcell'), inp = span.querySelector('input.cellin'), f = inp.dataset.f;
      const d = span.closest('tr').dataset.d, days = M(cur).days, r = days[d] || {};
      if (ca.classList.contains('ca-copy')) {
        const v = inp.value.trim();
        if (!v) { toast('无内容可复制'); return; }
        copyText(v); toast('已复制：' + v);
      } else {
        delete r[f]; if (!Object.keys(r).length) delete days[d];
        save(); renderKPI(); renderBody();
      }
      return;
    }
    const b = e.target.closest('.oa-btn'); if (!b) return;
    const d = b.closest('tr').dataset.d, days = M(cur).days, r = days[d] || (days[d] = {});
    if (r.oa) delete r.oa; else r.oa = '✅';
    if (!Object.keys(r).length) delete days[d];
    save(); renderBody();
  });
  // 回车跳到下一行同列
  tb.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const el = e.target; if (!el.classList.contains('cellin')) return;
    e.preventDefault(); el.blur();
    const tr = el.closest('tr').nextElementSibling;
    if (tr) { const nx = tr.querySelector(`[data-f="${el.dataset.f}"]`); if (nx) { nx.focus(); nx.select(); } }
  });
  bindTimePickers();
  bindRestPickers();
}

/* ------------------------- 月度加班柱状图（内联 SVG 手绘） ------------------------- */
function monthlyBarChart() {
  const months = monthKeys().filter(k => k <= cur).slice(-13);
  const data = months.map(k => { const c = compute(k); return { k, gain: +(c.gainTotal || 0), cash: +(c.cashTotal || 0), days: +(c.otDays || 0) }; });
  const n = data.length;
  if (!n) return '<div style="color:var(--tx-3);font-size:13px;padding:10px 0">暂无数据</div>';
  const W = 720, PL = 42, PR = 14, PT = 26, PB = 42, H = 286;
  const pw = W - PL - PR, ph = H - PT - PB;
  let maxV = 0;
  data.forEach(d => { maxV = Math.max(maxV, d.gain, d.cash); });
  if (maxV <= 0) maxV = 10;
  const step = maxV <= 20 ? 5 : (maxV <= 50 ? 10 : 20);
  maxV = Math.ceil(maxV / step) * step;
  const Y = v => PT + ph * (1 - v / maxV);
  const baseY = Y(0);
  const slotW = pw / n;
  const bw = Math.max(8, Math.min(slotW * 0.32, 24));
  const gapB = Math.min(bw * 0.5, slotW * 0.12);
  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const v = maxV * g / 4, y = Y(v).toFixed(1);
    grid += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#eef0f5" stroke-width="1"/>`;
    grid += `<text x="${PL - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="#9aa1b2">${Math.round(v)}</text>`;
  }
  let bars = '', xl = '';
  data.forEach((d, i) => {
    const xc = PL + (i + 0.5) * slotW;
    const gx = xc - bw - gapB / 2;
    const cx = xc + gapB / 2;
    const gh = Math.max(0, baseY - Y(d.gain));
    const ch = Math.max(0, baseY - Y(d.cash));
    bars += `<rect x="${gx.toFixed(1)}" y="${Y(d.gain).toFixed(1)}" width="${bw.toFixed(1)}" height="${gh.toFixed(1)}" rx="3" fill="#3b6fe0"><title>${d.k} 本月加班 ${hf(d.gain)}h · ${d.days} 天</title></rect>`;
    bars += `<rect x="${cx.toFixed(1)}" y="${Y(d.cash).toFixed(1)}" width="${bw.toFixed(1)}" height="${ch.toFixed(1)}" rx="3" fill="#16a34a"><title>${d.k} 折现 ${hf(d.cash)}h</title></rect>`;
    if (d.gain > 0) bars += `<text x="${(gx + bw / 2).toFixed(1)}" y="${(Y(d.gain) - 5).toFixed(1)}" text-anchor="middle" font-size="11" fill="#3b6fe0" font-weight="600">${hf(d.gain)}h</text>`;
    if (d.cash > 0) bars += `<text x="${(cx + bw / 2).toFixed(1)}" y="${(Y(d.cash) - 5).toFixed(1)}" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="600">${hf(d.cash)}h</text>`;
    const mm = +d.k.slice(5);
    xl += `<text x="${xc.toFixed(1)}" y="${(H - 22).toFixed(1)}" text-anchor="middle" font-size="12" fill="#6b7280">${mm}月</text>`;
    if (d.days > 0) xl += `<text x="${xc.toFixed(1)}" y="${(H - 8).toFixed(1)}" text-anchor="middle" font-size="11" fill="#9aa1b2">${d.days}天</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    ${grid}${bars}${xl}
  </svg>`;
}

/* ------------------------- 汇总视图 ------------------------- */

function bindSet() {
  document.querySelectorAll('[data-s]').forEach(el => el.addEventListener('change', () => {
    const k = el.dataset.s;
    DB.settings[k] = (el.type === 'number') ? (+el.value || 0) : el.value;
    save(); render(); toast('已保存');
  }));
  const sp = $('#setPass'), sb = $('#btnSetPass');
  if (sp && sb && !sb._bound) {
    sb._bound = true;
    sb.onclick = () => {
      const v = sp.value;
      if (!v) { DB.settings.passHash = ''; save(); toast('已关闭进入密码'); sp.value = ''; return; }
      DB.settings.passHash = passHash(v);
      save();
      toast('进入密码已设置，下次打开需输入');
      sp.value = '';
    };
  }
  bindSync();
}

/* ------------------------- 日期编辑弹窗 ------------------------- */
function openDay(d) {
  editing = d;
  const r = M(cur).days[d] || {}, [y, m] = cur.split('-').map(Number);
  const w = WD[new Date(y, m - 1, d).getDay()], t = dayType(cur, d);
  // 工作日默认 17:00 起（无已有记录时）；休息日/节假日不预设
  const defStart = (!r.start && t === 'work') ? '17:00' : (r.start || '');
  const defEnd = (!r.end && t === 'work') ? '18:00' : (r.end || '');
  // 换休默认 4 小时起（无已有记录时，任意日期）
  const defLeave = (r.leaveH === undefined || r.leaveH === null || r.leaveH === '') ? 4 : r.leaveH;
  const auto = autoHours(defStart, defEnd);
  const el = document.createElement('div'); el.className = 'mask'; el.id = 'mask';
  el.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-h"><div><h3>${m} 月 ${d} 日 · 周${w}</h3><p>类型：${TYPES.find(x => x.k === t).name}${r.type ? '（手动指定）' : '（自动判定）'}</p></div>
      <span class="spacer"></span><button class="btn ghost sm" onclick="closeDay()">✕</button></div>
    <div class="modal-b">
      <div class="frow">
        <div class="fld"><label>开始时间</label><select class="time-sel" id="f_start">${timeOptions(defStart)}</select></div>
        <div class="fld"><label>结束时间</label><select class="time-sel" id="f_end">${timeOptions(defEnd)}</select></div>
      </div>
      <div class="frow">
        <div class="fld"><label>加班时长（小时）</label><input id="f_hours" type="number" step="0.5" value="${r.hours !== undefined ? r.hours : ''}" placeholder="${auto !== null ? '自动 ' + hf(auto) : '留空自动计算'}"><div class="hint" id="autohint">${auto !== null ? '自动计算：' + hf(auto) + ' 小时' : '填开始/结束后自动计算'}</div></div>
        <div class="fld"><label>日期类型</label><select id="f_type">
          <option value=""${!r.type ? ' selected' : ''}>自动（${TYPES.find(x => x.k === dayTypeAuto(cur, d)).name}）</option>
          ${TYPES.map(x => `<option value="${x.k}"${r.type === x.k ? ' selected' : ''}>${x.name}</option>`).join('')}
        </select></div>
      </div>
      <div class="frow one"><div class="fld"><label>加班事由</label><input id="f_reason" value="${esc(r.reason)}" placeholder="例：书展物料设计"></div></div>
      <div class="frow">
        <div class="fld"><label>换休 / 调休（小时）</label><input id="f_leaveH" class="cellin" type="number" step="2" min="0" max="8" value="${defLeave || ''}" placeholder="0" style="max-width:120px"></div>
        <div class="fld"><label>事由</label><input id="f_leaveReason" value="${esc(r.leaveReason)}" placeholder="例：陪娃体检"></div>
      </div>
      <div class="frow">
        <div class="fld"><label>年假（天）</label><input id="f_annual" type="number" step="1" min="0" max="1" value="${r.annual || ''}" placeholder="0"></div>
        <div class="fld"><label>外出</label><label class="chk-inline"><input type="checkbox" id="f_outing" ${r.outing ? 'checked' : ''}> 记外出（仅请假记录）</label></div>
      </div>
      <div class="frow">
        ${t === 'work'
          ? `<div class="fld"><label>餐补（次）</label><div class="readonly-note">🍚 工作日加班≥1.5h 自动计 1 次（不可编辑）</div></div>`
          : `<div class="fld"><label>餐补（次）</label><input id="f_meal" type="number" step="1" min="0" value="${r.meal || ''}" placeholder="0"></div>`}
        <div class="fld"><label>说明</label><div class="readonly-note">换休 / 年假 / 外出 可多选（外出仅请假记录，不影响加班费）</div></div>
      </div>
      <div class="frow one"><div class="fld"><label>OA 流程</label>
        <div class="seg"><button type="button" id="oa_n" class="${!r.oa ? 'on' : ''}">未提交</button><button type="button" id="oa_y" class="${r.oa ? 'on' : ''}">✅ 已提交</button></div></div></div>
    </div>
    <div class="modal-f">
      <button class="btn danger" onclick="clearDay()">清空本日</button><span class="spacer"></span>
      <button class="btn" onclick="cancelDay()">取消</button><button class="btn primary" onclick="saveDay()">保存</button>

  el.onclick = closeDay;

  let oa = !!r.oa;
  $('#oa_y').onclick = () => { oa = true; $('#oa_y').classList.add('on'); $('#oa_n').classList.remove('on'); };
  $('#oa_n').onclick = () => { oa = false; $('#oa_n').classList.add('on'); $('#oa_y').classList.remove('on'); };
  el.dataset.oa = '';
  const upd = () => {
    const a = autoHours($('#f_start').value, $('#f_end').value);
    $('#autohint').textContent = a !== null ? '自动计算：' + hf(a) + ' 小时' : '填开始/结束后自动计算';
    $('#f_hours').placeholder = a !== null ? '自动 ' + hf(a) : '留空自动计算';
  };
  $('#f_start').addEventListener('input', upd); $('#f_end').addEventListener('input', upd);
  $('#f_start').focus();

}
function dayTypeAuto(key, d) {
  const r = M(key).days[d], t = r && r.type; if (t) { delete r.type; const v = dayType(key, d); r.type = t; return v; }
  return dayType(key, d);
}
function closeDay() { const m = $('#mask'); if (m) m.remove(); editing = null; }
function cancelDay() { closeDay(); setTimeout(scrollToToday, 0); }
function saveDay() {
  const d = editing, days = M(cur).days, r = {};
  const g = id => $('#' + id).value.trim();
  ['start', 'end', 'reason', 'leaveReason'].forEach(k => { const v = g('f_' + k); if (v) r[k] = v; });
  ['hours', 'leaveH', 'annual', 'meal'].forEach(k => { const v = g('f_' + k); if (v !== '') r[k] = +v || 0; });
  if (document.getElementById('f_outing').checked) r.outing = 1;
  // 年假：不超过剩余天数（累计全月，排除当前行旧值）
  if (r.annual > 0) {
    let used = 0;
    Object.keys(DB.months).forEach(k => {
      const ds = (DB.months[k] || {}).days || {};
      Object.keys(ds).forEach(dd => {
        if (k === cur && +dd === editing) return;        // 排除本行旧值
        used += +((ds[dd] || {}).annual) || 0;
      });
    });
    const annTotal = +DB.settings.annualTotal || 0, remain = Math.max(0, annTotal - used);
    if (r.annual > remain) {
      if (remain <= 0) { delete r.annual; toast('年假剩余不足，未记入'); }
      else { r.annual = remain; toast('年假已自动截断到剩余 ' + hf(remain) + ' 天'); }
    }
  }
  const ty = g('f_type'); if (ty) r.type = ty;
  if (window.__getOA && window.__getOA()) r.oa = '✅';
  if (Object.keys(r).length) days[d] = r; else delete days[d];
  save(); closeDay(); render(); toast('已保存 ' + cur + '-' + pad(d));
}
function clearDay() { delete M(cur).days[editing]; save(); closeDay(); render(); toast('已清空'); }

/* ------------------------- 导入导出 ------------------------- */
function dl(name, text, mime) {
  const b = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function exportJSON() { dl(`加班统计备份_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(DB, null, 1), 'application/json'); toast('已导出备份'); }
function exportCSV() {
  const n = daysIn(cur), mo = M(cur), L = [];
  L.push(['日期', '星期', '类型', '开始', '结束', '时长', '加班事由', '换休', '事由', '年假', '外出', '餐补', 'OA'].join(','));
  const [y, m] = cur.split('-').map(Number);
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d] || {}, t = TYPES.find(x => x.k === dayType(cur, d)).name;
    L.push([`${m}月${d}日`, '周' + WD[new Date(y, m - 1, d).getDay()], t, r.start || '', r.end || '',
      hoursOf(cur, d) || '', (r.reason || '').replace(/,/g, '，'), r.leaveH || '', (r.leaveReason || '').replace(/,/g, '，'),
      r.annual || '', r.outing || '', r.meal || '', r.oa ? '已提交' : ''].join(','));
  }
  const c = compute(cur);
  L.push('');

/* 从「换休核销台账」面板导出的四段对账文本（移入核销面板）
   段1：上月结转加班 ↔ 本月换休（核销口径，仅 30 天内）
   段2：本月加班 ↔ 本月换休（核销口径）
   段3：本月加班下月结转（逐日归属）
   段4：本月加班未结转计算加班费（逐日归属） */
function exportLedgerText(key) {
  const [y, m] = key.split('-').map(Number);
  const c = compute(key), n = daysIn(key);
  const pad2 = v => String(v).padStart(2, '0');
  const now = new Date();
  const ts = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const tname = t => t === 'work' ? '工作日' : (t === 'rest' ? '双休日' : '节假日');
  const srcLbl = e => e.earlier ? '更早月份结转' : `${e.m}月${e.d}日${e.t ? '（' + tname(e.t) + '）' : ''}`;
  const L = [];
  L.push('加班助手PRO · 换休核销四段对账');
  L.push(`${y} 年 ${m} 月`);
  L.push(`导出时间：${ts}`);
  L.push('');

  const d = leaveLedger(key);

  // ---- 段1：上月结转加班 ↔ 本月换休 ----
  L.push('【一、上月结转加班 ↔ 本月换休】');
  const carryPairs = [];
  d.leaves.forEach(l => l.pairs.forEach(p => {
    if (p.e.y !== y || p.e.m !== m)   // 来源不是本月 = 上月结转（含更早结转）
      carryPairs.push({ lvD: l.d, lvH: p.take, src: p.e, manual: p.manual, take: p.take });
  }));
  if (carryPairs.length) {
    let acc = '';
    carryPairs.forEach(pr => {
      acc = `${m}月${pr.lvD}日 换休 ${hf(pr.take)}h ← 上月结转${pr.src.earlier ? '（更早结转）' : ''} ${srcLbl(pr.src)} 加班 ${hf(pr.src.h)}h`;
      L.push('  · ' + acc);
    });
  } else {
    L.push('  （本月无核销上月结转的换休记录）');
  }
  L.push('');

  // ---- 段2：本月加班 ↔ 本月换休 ----
  L.push('【二、本月加班 ↔ 本月换休】');
  const curPairs = [];
  d.leaves.forEach(l => l.pairs.forEach(p => {
    if (p.e.y === y && p.e.m === m)   // 来源是本月加班
      curPairs.push({ lvD: l.d, lvH: p.take, src: p.e, manual: p.manual, take: p.take });
  }));
  if (curPairs.length) {
    curPairs.forEach(pr => {
      L.push(`  · ${m}月${pr.lvD}日 换休 ${hf(pr.take)}h ← ${m}月${pr.src.d}日 加班 ${hf(pr.src.h)}h${pr.manual ? '（手动指定）' : ''}`);
    });
  } else {
    L.push('  （本月换休均来自上月结转，无本月加班配对）');
  }
  // 超窗口/超有效期自动转加班费（未参与换休配对）的加班，单独提示
  const autoCashPool = d.carryPool.concat(d.curPool).filter(e => e.cash || e.expired);
  if (autoCashPool.length) {
    const expN = Math.round(+DB.settings.leaveExpireDays || 0);
    autoCashPool.forEach(e => {
      if (e.y === y && e.m === m)
        L.push(`  ※ ${m}月${e.d}日 加班剩余 ${hf(e.left)}h（${e.expired ? ('超' + expN + '天(产生日)') : '超30天(距换休)'}已自动转加班费）`);
    });
  }
  let unmatched = d.leaves.filter(l => l.short > 0.001);
  if (unmatched.length) unmatched.forEach(l => L.push(`  ⚠ ${m}月${l.d}日 换休缺 ${hf(l.short)}h 无30天内可用来源`));
  L.push('');

  // ---- 段3 & 段4：本月加班逐日归属（结转下月 / 未结转算加班费） ----
  // 归属规则（与计算引擎一致）：换休先消耗上月结转再消耗本月（本月内先产生先消耗）；
  // 剩余中，结转下月优先归属到较晚的加班日，未结转部分（较早的）逐日算加班费。
  const gainByDay = {};   // d -> {work,rest,holi}
  for (let d0 = 1; d0 <= n; d0++) {
    const h = hoursOf(key, d0); if (!(h > 0)) continue;
    const t = dayType(key, d0);
    (gainByDay[d0] = gainByDay[d0] || {})[t] = +h.toFixed(2);
  }
  // 1) 减去本月被换休消耗的部分 usedCur（本月内先产生先消耗 → 从 d=1 正序）
  const order = ['work', 'rest', 'holi'];
  order.forEach(t => {
    let need = c.usedCur[t];
    for (let d0 = 1; d0 <= n && need > 0.001; d0++) {
      if (!gainByDay[d0] || !(gainByDay[d0][t] > 0)) continue;
      const take = +Math.min(need, gainByDay[d0][t]).toFixed(2);
      gainByDay[d0][t] = +(gainByDay[d0][t] - take).toFixed(2);
      need = +(need - take).toFixed(2);
    }
  });
  // 2) 结转下月：从 d=n 倒序归属（较晚的优先结转）
  const carryByDay = {};
  order.forEach(t => {
    let need = c.carryOut[t];
    for (let d0 = n; d0 >= 1 && need > 0.001; d0--) {
      if (!gainByDay[d0] || !(gainByDay[d0][t] > 0)) continue;
      const take = +Math.min(need, gainByDay[d0][t]).toFixed(2);
      gainByDay[d0][t] = +(gainByDay[d0][t] - take).toFixed(2);
      carryByDay[d0] = carryByDay[d0] || { work: 0, rest: 0, holi: 0 };
      carryByDay[d0][t] = +(carryByDay[d0][t] + take).toFixed(2);
      need = +(need - take).toFixed(2);
    }
  });
  // 3) 剩余即「未结转算加班费」部分
  const cashByDay = {};
  order.forEach(t => {
    for (let d0 = 1; d0 <= n; d0++) {
      if (gainByDay[d0] && gainByDay[d0][t] > 0.001) {
        cashByDay[d0] = cashByDay[d0] || { work: 0, rest: 0, holi: 0 };
        cashByDay[d0][t] = +(cashByDay[d0][t] + gainByDay[d0][t]).toFixed(2);
      }
    }
  });

  L.push('【三、本月加班下月结转】');
  const R = c.rates;
  let carryTotal = 0;
  const carryDays = Object.keys(carryByDay).map(Number).sort((a, b) => a - b);
  if (carryDays.length) {
    carryDays.forEach(d0 => {
      order.forEach(t => {
        const v = carryByDay[d0][t];
        if (v > 0.001) {
          L.push(`  · ${m}月${d0}日 ${hf(v)}h ${tname(t)} → 结转下月`);
          carryTotal = +(carryTotal + v).toFixed(2);
        }
      });
    });
    L.push(`  本月结转下月合计：${hf(carryTotal)}h`);
  } else if (c.carryOutTotal > 0.001) {
    L.push(`  （结转 ${hf(c.carryOutTotal)}h：部分来自上月/更早结转余额，未精确到本月日期）`);
    carryTotal = c.carryOutTotal;
  } else {
    L.push('  （本月无结转下月时长）');
  }
  L.push('');

  L.push('【四、本月加班未结转算加班费】');
  let cashTotal = 0, cashMoney = 0;
  const cashDays = Object.keys(cashByDay).map(Number).sort((a, b) => a - b);
  if (cashDays.length) {
    cashDays.forEach(d0 => {
      order.forEach(t => {
        const v = cashByDay[d0][t];
        if (v > 0.001) {
          const amt = +(v * R[t]).toFixed(2);
          L.push(`  · ${m}月${d0}日 ${hf(v)}h ${tname(t)} → 加班费 ¥${fx(amt)}`);
          cashTotal = +(cashTotal + v).toFixed(2);
          cashMoney = +(cashMoney + amt).toFixed(2);
        }
      });
    });
    L.push(`  本月未结转算加班费合计：${hf(cashTotal)}h · ¥${fx(cashMoney)}`);
  } else if (c.cashTotal > 0.001) {
    L.push(`  （折现 ${hf(c.cashTotal)}h 全部来自上月/更早结转余额，无本月加班部分）`);
    cashTotal = c.cashTotal;
  } else {
    L.push('  （本月无未结转算加班费的时长）');
  }
  L.push('');

  // 汇总校验
  L.push('【汇总校验】');
  L.push(`  本月新增加班：${hf(c.gainTotal)}h`);
  L.push(`  本月换休：${hf(c.leaveTotal)}h（其中核销上月结转 ${hf(d.usedCarry)}h、核销本月加班 ${hf(d.usedCur)}h）`);
  L.push(`  结转下月：${hf(c.carryOutTotal)}h`);
  L.push(`  未结转算加班费：${hf(c.cashTotal)}h · ¥${fx(c.otPay)}`);
  L.push(`  餐补：${hf(c.mealCount)} 次 · ¥${fx(c.mealPay)}`);
  L.push('  口径说明：段一/二为核销口径（仅30天内配对），段三/四为结算口径（计算引擎），两套口径下被换休消耗的本月加班量可能不同，属正常差异。');
  if (d.warnings && d.warnings.length) L.push('  ⚠️ ' + d.warnings.join('；'));

  dl(`换休核销对账_${key}.txt`, '\uFEFF' + L.join('\n'), 'text/plain;charset=utf-8');
  toast('文本已导出');
}

/* 导出当月汇总为 TXT 文本（含换休一一对应 / 结转下月明细） */
function exportScreenshot() {
  const [y, m] = cur.split('-').map(Number);
  const mo = M(cur), n = daysIn(cur), c = compute(cur);
  const pad2 = v => String(v).padStart(2, '0');
  const now = new Date();
  const ts = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}-${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;

  const L = [];
  L.push('加班助手PRO · 当月汇总导出');
  L.push(`${y} 年 ${m} 月`);
  L.push(`导出时间：${ts}`);
  L.push('');

  let any = false;

  // 换休：按来源分组；上月结转做「换休日期/时长 ↔ 上月加班日期/时长」一一对应
  const carryLeaves = [], curLeaves = [], unspLeaves = [];
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d]; if (!r || !r.leaveH) continue;
    const item = { d, h: +r.leaveH, reason: r.leaveReason || '' };
    if (r.leaveSrc === 'carry') carryLeaves.push(item);
    else if (r.leaveSrc && String(r.leaveSrc).startsWith('D')) { item.srcDay = +String(r.leaveSrc).slice(1); curLeaves.push(item); }
    else unspLeaves.push(item);
  }
  if (carryLeaves.length || curLeaves.length || unspLeaves.length) {
    any = true;
    L.push(`【换休（${m}月）】`);
    if (carryLeaves.length) {
      // 上月加班来源（按日期顺序，仅工作日，结转池）
      const pk = prevKey(cur);
      const prevOt = [];
      if (DB.months[pk]) {
        const [py, pm0] = pk.split('-').map(Number);
        const pn = daysIn(pk);
        for (let d = 1; d <= pn; d++) {
          const r = M(pk).days[d]; if (!r) continue;
          if (dayType(pk, d) !== 'work') continue;
          const h = hoursOf(pk, d); if (!h) continue;
          prevOt.push({ d, h, y: py, m: pm0 });
        }
      }
      // FIFO 配对：换休条目的时长，按序从上月加班里逐笔扣减，得到一一对应
      let pi = 0, pleft = prevOt.length ? prevOt[0].h : 0;
      carryLeaves.forEach(lv => {
        let rem = lv.h, parts = [];
        while (rem > 0.001 && pi < prevOt.length) {
          const take = Math.min(rem, pleft);
          parts.push(`${prevOt[pi].y}年${prevOt[pi].m}月${prevOt[pi].d}日 ${hf(take)}h加班`);
          rem = +(rem - take).toFixed(2);
          pleft = +(pleft - take).toFixed(2);
          if (pleft <= 0.001) { pi++; if (pi < prevOt.length) pleft = prevOt[pi].h; }
        }
        let line = `  · ${m}月${lv.d}日 换休 ${hf(lv.h)}h`;
        if (lv.reason) line += `（事由：${lv.reason}）`;
        line += ` → 上月结转：${parts.join(' + ') || '（无对应来源记录）'}`;
        L.push(line);
      });
    }
    curLeaves.forEach(lv => {
      let line = `  · ${m}月${lv.d}日 换休 ${hf(lv.h)}h`;
      if (lv.reason) line += `（事由：${lv.reason}）`;
      line += ` → 对应 ${m}月${lv.srcDay}日加班`;
      L.push(line);
    });
    unspLeaves.forEach(lv => {
      let line = `  · ${m}月${lv.d}日 换休 ${hf(lv.h)}h`;
      if (lv.reason) line += `（事由：${lv.reason}）`;
      L.push(line);
    });
    L.push(`本月换休共计 ${hf(c.leaveTotal)}h`);
    L.push('');
  }

  // 加班费：当月所有有加班时长的日期（含已结转下月的部分，单独标注）
  const payLines = [];
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d]; if (!r) continue;
    const h = hoursOf(cur, d); if (!h) continue;
    const t = dayType(cur, d);
    const tname = t === 'work' ? '工作日' : (t === 'rest' ? '双休日' : '节假日');
    let line = `  · ${m}月${d}日 ${hf(h)}h ${tname}`;
    if (r.reason) line += ` · ${r.reason}`;
    payLines.push(line);
  }
  if (payLines.length) {
    any = true;
    L.push('【加班费】');
    payLines.forEach(l => L.push(l));
    if (c.carryOutTotal > 0) {
      L.push(`  ※ 其中结转到下月（不计入本月加班费）：${hf(c.carryOutTotal)}h（工作日）`);
    }
    L.push(`本月折现/算加班费：${hf(c.cashTotal)}h，约 ¥${c.otPay}`);
    L.push('');
  }

  // 年假
  const annualLines = [];
  let annMonth = 0;
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d]; if (!r || !r.annual) continue;
    annMonth += +r.annual;
    let line = `${m}月${d}日 ${hf(+r.annual)}天`;
    if (r.leaveReason) line += ` · ${r.leaveReason}`;
    annualLines.push(line);
  }
  if (annualLines.length) {
    const annTotal = +DB.settings.annualTotal || 0;
    let annUsed = 0;
    Object.keys(DB.months).forEach(k => {
      Object.values((DB.months[k] || {}).days || {}).forEach(rr => annUsed += +(rr.annual || 0));
    });
    any = true;
    L.push('【年假】');
    annualLines.forEach(l => L.push('  ' + l));
    L.push(`本月年假共计 ${hf(annMonth)}天 · 额度 ${hf(annTotal)} 剩余 ${hf(Math.max(0, annTotal - annUsed))} 天`);
    L.push('');
  }

  // 外出
  const outingLines = [];
  let outingMonth = 0;
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d]; if (!r || !r.outing) continue;
    outingMonth += +r.outing;
    let line = `${m}月${d}日 外出`;
    if (r.leaveReason) line += ` · ${r.leaveReason}`;
    outingLines.push(line);
  }
  if (outingLines.length) {
    any = true;
    L.push('【外出】');
    outingLines.forEach(l => L.push('  ' + l));
    L.push(`本月外出共计 ${hf(outingMonth)}天`);
    L.push('');
  }

  if (!any) { toast('当月无数据可导出'); return; }

  dl(`加班汇总_${cur}.txt`, '﻿' + L.join('\n'), 'text/plain;charset=utf-8');
  toast('文本已导出');
}

function importJSON(file) {

    try {
      const o = JSON.parse(fr.result);
      if (!o.months) throw 0;
      DB = { version: 1, settings: Object.assign({}, DEF_SETTINGS, o.settings), months: o.months };
      save(); load(); render(); toast('导入成功');
    } catch (e) { toast('文件格式不正确'); }
  };
  fr.readAsText(file);
}

function bindMonthPicker() {
  const wrap = $('#mselWrap'), btn = $('#mselBtn'), pop = $('#mselPop');
  if (!wrap || !btn || !pop) return;
  const outside = e => { if (!wrap.contains(e.target)) hide(); };
  const onKey = e => { if (e.key === 'Escape') hide(); };
  function show() {
    renderTop(); pop.hidden = false;
    requestAnimationFrame(() => {
      ensureSpacers(pop, '.mopt');
      centerOn(pop, pop.querySelector('.mopt.cur'));
      scrollHighlightMark(pop, '.mopt');
    });
    setTimeout(() => document.addEventListener('click', outside, true), 0);
    document.addEventListener('keydown', onKey);
  }
  function hide() { pop.hidden = true; document.removeEventListener('click', outside, true); document.removeEventListener('keydown', onKey); }
  btn.addEventListener('click', e => { e.stopPropagation(); pop.hidden ? show() : hide(); });
  pop.addEventListener('click', e => {
    const del = e.target.closest('.mopt-del');
    if (del) {
      e.stopPropagation();
      const k = del.dataset.del;
      const ks = monthKeys();
      const isCur = k === cur;
      const isLast = k === ks[ks.length - 1];
      if (!isLast) { toast('只能删除最末尾的月份，以保持结转链连续'); return; }
      confirmDialog({ title:'删除月份', msg:`确定删除 ${k.replace('-', ' 年 ')} 月吗？该月所有加班/换休记录将被清除，且不可恢复。`, okText:'删除', danger:true, onOk:() => {
        delete DB.months[k];
        if (isCur) {
          const nks = monthKeys();
          cur = nks[nks.length - 1] || mk(new Date().getFullYear(), new Date().getMonth() + 1);
          if (!DB.months[cur]) DB.months[cur] = { days: {} };
        }
        save(); render(); hide();
      }});
      return;
    }
    const it = e.target.closest('.mopt');
    if (it) { cur = it.dataset.v; render(); hide(); return; }
    const nw = e.target.closest('.mnew');
    if (nw && !nw.disabled) { newMonth(); hide(); }
  });
  pop.addEventListener('wheel', e => { e.preventDefault(); pop.scrollTop += (e.deltaY > 0 ? 40 : -40); }, { passive: false });
  attachScrollHighlight(pop, '.mopt');
}

/* ============================ 进入密码（访问保护） ============================ */
function setLockErr(msg) { const el = $('#lockErr'); if (el) el.textContent = msg || ''; }
function tryUnlock() {
  const inp = $('#lockPass'); if (!inp) return;
  const ph = (DB && DB.settings && DB.settings.passHash) || '';
  if (!ph) { document.body.classList.remove('locked'); return; }
  if (passHash(inp.value) === ph) {
    document.body.classList.remove('locked');
    setLockErr('');
    inp.blur();
  } else {
    setLockErr('密码错误，请重试');
    inp.value = ''; inp.focus();
  }
}
function maybeLock() {
  const ph = (DB && DB.settings && DB.settings.passHash) || '';
  if (!ph) { document.body.classList.remove('locked'); return; }
  document.body.classList.add('locked');
  setLockErr('');
  const inp = $('#lockPass');
  if (inp) { inp.value = ''; setTimeout(() => inp.focus(), 30); }
  const btn = $('#lockBtn');
  if (btn && !btn._bound) { btn._bound = true; btn.onclick = tryUnlock; }
  const ip = $('#lockPass');
  if (ip && !ip._bound) { ip._bound = true; ip.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); }); }
}
/* 应用内刷新：拉取云端最新并刷新视图，不刷新整页（不会重新要求输入密码） */
async function refreshApp() {
  if (SYNC.token && SYNC.gist) {
    await syncDownload(true);
    toast('已刷新：拉取云端最新');
  } else {
    render();
    toast('已刷新视图');
  }
}

/* ============================ 启动 ============================ */
function boot() {
  load();
  maybeLock();
  bindMonthPicker();
  $('#mprev').onclick = () => { const ks = monthKeys(), i = ks.indexOf(cur); if (i > 0) { cur = ks[i - 1]; render(); } };
  $('#mnext').onclick = () => { const ks = monthKeys(), i = ks.indexOf(cur); if (i < ks.length - 1) { cur = ks[i + 1]; render(); } };
  $('#imp').addEventListener('change', e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ''; });
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  $('#btnRefresh').onclick = refreshApp;
  $('#btnToday').onclick = () => {
    const now = new Date(), nowK = mk(now.getFullYear(), now.getMonth() + 1);
    cur = monthKeys().includes(nowK) ? nowK : (monthKeys().length ? monthKeys()[monthKeys().length - 1] : nowK);
    if (tab === 'sum' || tab === 'set') tab = 'cal';
    render();
    setTimeout(scrollToToday, 30);
  };
  // KPI 区域滚动鼠标滚轮切换视图（明细 → 日历 → 汇总 → 明细 …），高度锁避免连跳
  const kpiEl = $('#kpi');
  kpiEl.title = '在此区域滚动鼠标滚轮可切换「明细 / 日历 / 汇总」视图';
  const tabCycle = ['list', 'cal', 'sum'];
  let wheelLock = false;
  kpiEl.addEventListener('wheel', e => {
    e.preventDefault();
    if (wheelLock) return;
    const dir = e.deltaY > 0 ? 1 : -1;
    let idx = tabCycle.indexOf(tab); if (idx === -1) idx = 0;
    idx = (idx + dir + tabCycle.length) % tabCycle.length;
    const next = tabCycle[idx];
    if (next !== tab) { tab = next; render(); }
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 420);
  }, { passive: false });

  // KPI 顶栏保持常驻，不再随滚动收起（用户要求）；上方滚轮仍可切换明细/日历/汇总视图
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (carryInView) { exitCarryInView(); return; }
      closeDay();
    }
    if (e.key === 'Enter' && $('#mask') && e.target.tagName === 'INPUT') saveDay();
  });
  render();
  if (SYNC.token && SYNC.gist && (SYNC.auto || SYNC.downloadOnly)) syncDownload(true);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
