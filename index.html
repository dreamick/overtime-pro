<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>加班助手PRO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234c7bff'/><text y='70' x='50' text-anchor='middle' font-size='58' fill='white' font-family='sans-serif'>加</text></svg>">
<style>/* ---------- 自定义时间选择器：仅显示临近 5 档，滚轮查看更多 ---------- */
.tsel{position:relative;display:block;width:100%}
.tsel-in{cursor:pointer;width:100%;text-align:center;padding-right:16px}
.tsel-in.empty{color:#cdd3e0}
.tsel-clr{
  position:absolute;right:3px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;line-height:13px;text-align:center;font-size:13px;
  color:#c2c8d6;cursor:pointer;border-radius:50%;opacity:0;transition:opacity .12s,color .12s,background .12s;
}
.tsel:hover .tsel-clr{opacity:.85}
.tsel-clr:hover{color:#e2484d;background:#fdecec}
.hcell{position:relative;display:block;width:100%}
.hcell .cellin{width:100%;padding-right:16px}
.hcell-clr{
  position:absolute;right:3px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;line-height:13px;text-align:center;font-size:13px;
  color:#c2c8d6;cursor:pointer;border-radius:50%;opacity:0;transition:opacity .12s,color .12s,background .12s;
}
.hcell:hover .hcell-clr{opacity:.85}
.hcell-clr:hover{color:#e2484d;background:#fdecec}
/* 事由单元格：复制 + 清除按钮，悬停淡显 */
.rcell{position:relative;display:inline-block;vertical-align:middle}
.rcell .cellin{padding-right:34px}
.rcell .ca{
  position:absolute;top:50%;transform:translateY(-50%);
  width:15px;height:15px;line-height:14px;text-align:center;font-size:12px;
  color:#c2c8d6;cursor:pointer;border-radius:50%;opacity:0;transition:opacity .12s,color .12s,background .12s;
}
.rcell .ca-copy{right:18px}
.rcell .ca-clr{right:3px}
.rcell:hover .ca{opacity:.85}
.rcell .ca:hover{color:#e2484d;background:#fdecec}
.tsel-pop{
  position:absolute;z-index:60;top:calc(100% + 5px);left:0;
  width:92px;height:200px;overflow-y:auto;overflow-x:hidden;padding:6px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 14px 36px rgba(20,30,60,.20);animation:popin .14s ease;
}
.tsel-pop .pop-hd,.lsel-pop .pop-hd{
  font-size:11px;font-weight:600;color:var(--tx-3);padding:2px 4px 6px;text-align:center;letter-spacing:.3px;
}
.tsel-pop .pop-hd{position:sticky;top:0;background:#fff;z-index:2}
.tsel-pop .topt{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:7px 8px;margin:1px 0;font-size:13px;text-align:center;color:var(--tx);
  cursor:pointer;border-radius:8px;font-variant-numeric:tabular-nums;line-height:1.3;transition:.12s;
}
.tsel-pop .topt:hover{background:var(--brand-soft)}
.tsel-pop .topt.on{background:var(--brand);color:#fff;font-weight:600}
.tsel-pop .topt.cur{background:var(--brand);color:#fff;font-weight:600}
/* 换休：点击弹框选择 2/4/6/8 */
.lsel{position:relative;display:block;width:100%}
.lsel-in{cursor:pointer;width:100%;text-align:center;box-sizing:border-box;border:none;background:transparent;outline:none;padding:0;font:inherit;color:#7c3aed;appearance:none;-webkit-appearance:none;-moz-appearance:none}
.lsel-in.empty{color:#cdd3e0}
.lsel-in:focus{box-shadow:inset 0 0 0 2px var(--brand);border-radius:6px}
.lsel-pop{
  position:fixed;z-index:60;
  width:auto;min-width:240px;max-width:320px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 14px 36px rgba(20,30,60,.20);animation:popin .14s ease;overflow:hidden;
  display:flex;gap:4px;flex-wrap:wrap;
}
.lsel-pop[hidden],.tsel-pop[hidden],.asel-pop[hidden],.msel-pop[hidden]{display:none}
.lsel-pop .lopt-col{display:flex;flex-direction:column;gap:2px;flex:1}
.lsel-pop .lopt-hd{font-size:11px;color:var(--tx-3);text-align:center;font-weight:600;padding:1px 0 3px}
.lsel-pop .lopt-foot{flex-basis:100%;display:flex;justify-content:center;padding-top:5px;margin-top:3px;border-top:1px solid var(--line)}
.lsel-pop .lopt-clear{border:none;background:transparent;color:#ef4444;font-size:12px;cursor:pointer;padding:2px 10px}
.lsel-circles{display:inline-flex;gap:4px;align-items:center;justify-content:center;min-height:22px;cursor:pointer;flex-wrap:wrap}
.rest-empty{color:#cdd3e0;font-size:14px}
.rest-circle{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:600;line-height:1}
.rc-lv{background:#7c3aed}
.rc-an{background:#1a9d50}
.rc-ot{background:#2563eb}
.lsel-pop .lopt{
  display:flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;
  height:34px;font-size:13px;text-align:center;color:var(--tx);
  cursor:pointer;border-radius:8px;font-variant-numeric:tabular-nums;line-height:1;transition:.12s;
}
.lsel-pop .lopt:hover{background:var(--brand-soft)}
.lsel-pop .lopt.on{background:var(--brand);color:#fff;font-weight:600}
.lsel-pop .lopt-annual{color:#1a9d50;font-weight:600}
.lsel-pop .lopt-annual:hover{background:#e8f7f0}
.lsel-pop .lopt-annual.on{background:#1a9d50;color:#fff}
.lsel-in.annual-val{color:#15803d;font-weight:650}
.cellin.lr-lv{color:#7c3aed}
.cellin.lr-an{color:#15803d}
.lsel-disabled{display:inline-block;width:52px;text-align:center;color:#c2c8d6;font-size:13.5px;cursor:not-allowed;user-select:none}
/* 外出：蓝色字 + 选中数字蓝色圈（圈由 restPicker 内联样式给出） */
.lsel-in.outing-val{color:#2563eb;font-weight:650}
.lsel-pop .lopt-outing{color:#2563eb;font-weight:600}
.lsel-pop .lopt-outing:hover{background:#e8f0fe}
.lsel-pop .lopt-outing.on{background:#2563eb;color:#fff}
.cellin.lr-ot{color:#2563eb}
/* 换休·年假·外出 列头与选项配色：换休紫 / 年假绿 / 外出蓝 */
.lsel-pop .lopt-col:nth-child(1) .lopt-hd{color:#7c3aed}
.lsel-pop .lopt-col:nth-child(2) .lopt-hd{color:#1a9d50}
.lsel-pop .lopt-col:nth-child(3) .lopt-hd{color:#2563eb}
.lsel-pop .lopt-leaveH{color:#7c3aed;font-weight:600}
.lsel-pop .lopt-leaveH:hover{background:#f3ebfd}
.lsel-pop .lopt-leaveH.on{background:#7c3aed;color:#fff}
.chk-inline{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--tx-2)}
.chk-inline input{width:16px;height:16px;accent-color:#2563eb;cursor:pointer}
/* 换休弹窗：纯选项列表，无标题栏 */

/* 年假：点击弹框选择 0/1 */
.asel{position:relative;display:block;width:100%;border-radius:8px;transition:.14s}
.asel:hover{background:var(--brand-soft)}
.asel-in{cursor:pointer;width:100%;text-align:center;box-sizing:border-box;transition:.14s;border-radius:8px;border:none;background:transparent;outline:none;padding:0;font:inherit;color:inherit}
.asel-in.empty{color:#cdd3e0}
.asel.on .asel-in{background:#eef1f6;color:var(--tx);font-weight:700}
.asel-pop{
  position:absolute;z-index:60;top:calc(100% + 3px);left:50%;transform:translateX(-50%);
  width:56px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 28px rgba(20,30,60,.18);
}
.asel-pop .aopt{
  padding:7px 8px;margin:1px 0;font-size:13px;text-align:center;color:var(--tx);
  cursor:pointer;border-radius:7px;font-variant-numeric:tabular-nums;line-height:1.3;
}
.asel-pop .aopt:hover{background:var(--brand-soft)}
.asel-pop .aopt.on{background:var(--brand);color:#fff;font-weight:600}

:root{
  --bg:#f4f6fa;
  --card:#ffffff;
  --line:#e6e9f0;
  --line-2:#f0f2f7;
  --tx:#1c2030;
  --tx-2:#4b5163;
  --tx-3:#7a8398;
  --brand:#3b6bff;
  --brand-soft:#eef2ff;
  --work:#3b6bff;
  --rest:#f5a524;
  --holi:#e5484d;
  --ok:#12b76a;
  --shadow:0 1px 2px rgba(20,28,60,.04), 0 8px 24px rgba(20,28,60,.06);
  --shadow-lg:0 12px 40px rgba(20,28,60,.14);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--tx);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d6dae4;border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#c2c8d6}

/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:18px 24px 0;
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  flex:0 0 auto;
  height:58px;
  position:sticky;top:0;z-index:40;
  background:rgba(244,246,250,.86);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1280px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.2px;font-size:16px;white-space:nowrap}
.logo .mk{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,#4c7bff,#7a5cff);color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 4px 12px rgba(76,123,255,.32);
}
.spacer{flex:1}

/* month switcher */
.msw{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.msw button{width:28px;height:28px;border-radius:8px;color:var(--tx-2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
.msw button:hover{background:var(--line-2);color:var(--tx)}
.msw button:disabled{opacity:.28;cursor:default;background:none}
.msw .cur{position:relative}
.msel-btn{
  appearance:none;border:none;background:none;font-weight:650;font-size:14.5px;
  padding:4px 10px;border-radius:8px;cursor:pointer;text-align:center;color:var(--tx);
  font-family:inherit;white-space:nowrap;min-width:90px;
}
.msel-btn:hover{background:var(--line-2)}
.msel-wrap{display:inline-block}
.msel-pop{
  position:absolute;z-index:70;top:calc(100% + 5px);left:50%;transform:translateX(-50%);
  width:180px;max-height:150px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 14px 36px rgba(20,30,60,.20);animation:popin .14s ease;overflow-y:auto;overscroll-behavior:contain;
}
.msel-pop .mopt{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  min-height:38px;padding:7px 8px;margin:1px 0;font-size:13px;color:var(--tx);
  cursor:pointer;border-radius:8px;transition:.12s;
}
.msel-pop .mopt:hover{background:var(--brand-soft)}
.msel-pop .mopt.on{background:var(--brand);color:#fff;font-weight:600}
.msel-pop .mopt.cur{box-shadow:inset 3px 0 0 var(--brand)}
.msel-pop .mopt .mopt-lbl{display:flex;align-items:center;justify-content:flex-start;gap:6px;flex:1;padding-right:28px}
.msel-pop .mopt .ck{font-size:11px;font-weight:700}
.msel-pop .mopt-del{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  color:var(--tx-3);font-size:15px;line-height:1;cursor:pointer;transition:.12s;
}
.msel-pop .mopt:hover .mopt-del{color:#e5484d;background:#fdecec}
.msel-pop .mopt-del:hover{color:#fff;background:#e5484d}
.msel-pop .mopt.on .mopt-del{color:rgba(255,255,255,.85);background:rgba(255,255,255,.18)}
.msel-pop .mopt.on .mopt-del:hover{color:#fff;background:#e5484d}
.msel-pop .mopt-del[hidden]{display:none}
.msel-pop .mnew{
  width:100%;box-sizing:border-box;appearance:none;border:none;
  display:flex;align-items:center;justify-content:flex-start;
  min-height:38px;margin-top:4px;padding:7px 8px;font-size:13px;font-weight:600;
  color:var(--brand);background:var(--brand-soft);border-radius:8px;cursor:pointer;transition:.12s;
  white-space:nowrap;font-family:inherit;
}
.msel-pop .mnew:hover{background:#dfe7ff}
.msel-pop .mnew:disabled{opacity:.5;cursor:default}

.btn{
  height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--tx-2);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  box-shadow:var(--shadow);transition:.16s;white-space:nowrap;
}
.btn:hover{color:var(--tx);border-color:#d3d9e6;transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(59,107,255,.28)}
.btn.primary:hover{background:#2f5cf0}
.btn.ghost{background:none;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--holi)}
.btn.danger:hover{background:#fef2f2;border-color:#fbd5d5}

/* tabs */
.tabs{display:flex;gap:2px;background:#eaedf4;padding:3px;border-radius:11px}
.tabs button{padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--tx-2);transition:.16s}
.tabs button:hover{color:var(--tx)}
.tabs button.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(59,107,255,.30)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 18px 0}
.card-h h3{font-size:14px;font-weight:650;letter-spacing:-.1px}
.card-h .sub{font-size:12px;color:var(--tx-3);font-weight:400}

.grid-kpi{
  display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;
  padding:12px 0;margin:0;flex:0 0 auto;
  transition:max-height .15s ease,opacity .12s ease,padding .15s ease,margin .15s ease;
  max-height:none;opacity:1;overflow:visible;
}
/* 防御性保险：即便旧版 JS 残留给 KPI 加 .kpi-hidden，也绝不隐藏（用户要求 KPI 常驻） */
#kpi.kpi-hidden{display:grid!important;max-height:none!important;opacity:1!important;padding-top:12px!important;padding-bottom:12px!important;margin:0!important}
/* KPI 卡片：白底 + 彩色顶边；文字加深、对比度更高；去掉点击聚焦白框 */
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--ac, var(--line));border-radius:var(--r);padding:clamp(7px,1.1vw,10px) clamp(8px,1.4vw,12px);box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;cursor:pointer;user-select:none;transition:background .12s ease,box-shadow .12s ease}
.kpi:hover{background:color-mix(in srgb,var(--ac,#3b6bff) 5%,#fff)}
.kpi:focus,.kpi:focus-visible{outline:none}
/* active 态：彩色淡底（与筛选 chip 同色系）+ 同色内嵌描边（保留彩色描边、去掉白框） */
.kpi.active{background:color-mix(in srgb,var(--ac,#3b6bff) 14%,#fff);box-shadow:inset 0 0 0 2px var(--ac,#3b6bff)}
.kpi-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.kpi-ic{width:clamp(18px,1.6vw,22px);height:clamp(18px,1.6vw,22px);border-radius:7px;display:grid;place-items:center;font-size:clamp(10px,1vw,12px);flex:0 0 auto;background:color-mix(in srgb,var(--ac,#3b6bff) 16%,#fff);color:var(--ac,#3b6bff)}
.kpi .lb{font-size:clamp(11px,1.1vw,12.5px);color:var(--ac,var(--tx));display:flex;align-items:center;gap:5px;font-weight:600;min-width:0;overflow:hidden}
.kpi .vl{font-size:clamp(15px,1.9vw,20px);font-weight:700;letter-spacing:-.6px;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ac,var(--tx))}
.kpi .vl small{font-size:clamp(10px,1.05vw,12px);font-weight:500;color:var(--tx-2);margin-left:3px;letter-spacing:0}
.kpi .df{font-size:clamp(10.5px,1.05vw,12px);color:var(--tx-1);margin-top:5px;font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
.kpi .df b{font-weight:600;color:var(--tx)}
.kpi .df .muted{color:var(--tx-2)}
.kpi .df .lt{color:var(--tx-2)}
.kpi.hl-blue .df .muted{color:var(--tx-2)}
.kpi.hl-orange .df .muted{color:var(--tx-2)}
.kpi-bar{height:4px;background:var(--line-2);border-radius:2px;margin-top:6px;overflow:hidden}
.kpi-bar-in{height:100%;background:var(--ac,#3b6bff);border-radius:2px;transition:width .2s ease}
.kpi-bar-in.over{background:var(--holi)}
/* 高亮卡（餐补/加班费）：与普通 KPI 同样样式——白底 + 彩色顶边；文字/图标用自身 --ac 彩色 */
.kpi.hl-blue .kpi-ic{background:color-mix(in srgb,#3b6bff 16%,#fff);color:#3b6bff}
.kpi.hl-blue .lb{color:#3b6bff;font-weight:600}
.kpi.hl-blue .vl{color:#2a4fd6}
.kpi.hl-blue .vl small{color:var(--tx-2)}
.kpi.hl-blue .df{color:var(--tx-1)}
.kpi.hl-blue .df .lt{color:var(--tx-2)}
.kpi.hl-blue .df b{color:var(--tx)}
.kpi.hl-orange .kpi-ic{background:color-mix(in srgb,#ff7a18 16%,#fff);color:#ff7a18}
.kpi.hl-orange .lb{color:#ff7a18;font-weight:600}
.kpi.hl-orange .vl{color:#ea580c}
.kpi.hl-orange .vl small{color:var(--tx-2)}
.kpi.hl-orange .df{color:var(--tx-1)}
.kpi.hl-orange .df .lt{color:var(--tx-2)}
.kpi.hl-orange .df b{color:var(--tx)}
/* 加班费：点击打开结算面板（非筛选），不加 hover 底色、不加 active 描边/底色 */
.kpi.hl-orange:hover{background:#fff}
.kpi.hl-orange.active{background:#fff;box-shadow:var(--shadow)}
@keyframes popin{from{opacity:0}to{opacity:1}}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}

.cols{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}

/* ---------- calendar ---------- */
.cal{padding:6px 14px 14px}
.cal-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px 0 6px}
.cal-hd div{text-align:center;font-size:11.5px;color:var(--tx-3);font-weight:600;letter-spacing:.4px}
.cal-hd div.we{color:var(--rest)}
.cal-bd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cel{
  position:relative;min-height:88px;border-radius:11px;border:1px solid var(--line-2);
  background:#fcfdff;padding:7px 8px 6px;text-align:left;transition:.14s;overflow:hidden;cursor:default;
}
.cel:hover{border-color:#c9d3f0;background:#fff;z-index:2}
.cel.pad{background:transparent;border-color:transparent;pointer-events:none}
.cel.rest{background:linear-gradient(180deg,#fff8ec,#fffdf7);box-shadow:inset 3px 0 0 #f5a524}
.cel.holi{background:linear-gradient(180deg,#ffecec,#fff5f5);box-shadow:inset 3px 0 0 #e5484d}
.cel.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.cel .dn{font-size:13px;font-weight:600;color:var(--tx-2);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:space-between}
.cel.rest .dn{color:#b57810}
.cel.holi .dn{color:#c0393d}
.cel .tag{font-size:10px;padding:1px 5px;border-radius:5px;font-weight:600;letter-spacing:.2px}
.cel .tag.r{background:#fdefd7;color:#a86c0a}
.cel .tag.h{background:#fde3e3;color:#c0393d}
.cel .tag.w{background:#e6ecff;color:#3355cc}
.cel .bar{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.pill{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  padding:2px 6px;border-radius:6px;line-height:1.4;width:fit-content;max-width:100%;
  font-variant-numeric:tabular-nums;
}
.pill.ot{background:#e6ecff;color:#2a4fd6}
.pill.ot.r{background:#fdefd7;color:#a86c0a}
.pill.ot.h{background:#fde3e3;color:#c0393d}
.pill.lv{background:#e8f7ef;color:#0f8a52}
.pill.an{background:#f2ebff;color:#6b3fd4}
.cel .rsn{font-size:10.5px;color:var(--tx-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cel .mk{position:absolute;right:7px;bottom:6px;display:flex;gap:3px;align-items:center}
.cel .mk i{font-style:normal;font-size:10px;line-height:1}

/* ---------- summary panel ---------- */
.flow{padding:14px 18px 18px}
.flow-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line-2);font-variant-numeric:tabular-nums}
.flow-row:last-child{border-bottom:none}
.flow-row .k{font-size:13.5px;color:var(--tx-2);display:flex;align-items:center;gap:7px}
.flow-row .v{font-size:14.5px;font-weight:620}
.flow-row.tot{margin-top:6px;padding-top:12px;border-top:1.5px solid var(--line);border-bottom:none}
.flow-row.tot .k{font-weight:600;color:var(--tx)}
.flow-row.tot .v{font-size:20px;color:var(--brand);letter-spacing:-.4px}
.op{color:var(--tx-3);font-weight:400;font-size:12px}

table.tb{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
table.tb th{
  font-size:11.5px;font-weight:600;color:var(--tx-3);text-align:right;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1
}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line-2);font-size:13px}
table.tb tr:last-child td{border-bottom:none}
table.tb tbody tr:hover td{background:#fafbfe}
table.tb tfoot td{font-weight:650;border-top:1.5px solid var(--line);border-bottom:none;background:#fafbfe}
.muted{color:var(--tx-3)}
.zero{color:#c8cddb}
/* 顶部预警横幅 */
#alerts{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px;padding-bottom:4px}
.alert{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;animation:popin .16s ease;position:relative}
.alert .ai{flex:0 0 auto;font-size:16px;line-height:1.3}
.alert.warn{background:#fff7e6;border:1px solid #ffe1a8;color:#92590a}
.alert.danger{background:#fdecec;border:1px solid #f6c4c4;color:#c0392b}
.alert.info{background:#eef3ff;border:1px solid #d6e2ff;color:#2b4ea8}
.alert b{font-weight:700}
.alert.clickable{cursor:pointer;transition:background .12s,box-shadow .12s}
.alert.warn.clickable:hover{background:#fff0d4;box-shadow:inset 0 0 0 1px #ffd591}
.alert.danger.clickable:hover{background:#fde2e2;box-shadow:inset 0 0 0 1px #f3b6b6}
.alert.info.clickable:hover{background:#e6edff;box-shadow:inset 0 0 0 1px #cad9ff}
.alert .caret{flex:0 0 auto;margin-left:4px;align-self:center;font-size:11px;color:currentColor;opacity:.65;transition:transform .2s;user-select:none}
.alert.expanded .caret{transform:rotate(180deg)}
.alert .hint{flex:0 0 auto;align-self:center;font-size:11px;color:currentColor;opacity:.55;letter-spacing:.5px;font-weight:500;user-select:none}
.alert .alert-x{flex:0 0 auto;margin-left:auto;align-self:center;border:0;background:rgba(0,0,0,.06);color:inherit;font-size:13px;line-height:1;height:26px;min-width:26px;padding:0 8px;border-radius:8px;cursor:pointer;transition:background .12s;position:relative;z-index:1}
.alert .alert-x:hover{background:rgba(0,0,0,.12)}
.alert.danger .alert-x{background:rgba(192,57,43,.12)}
.alert.danger .alert-x:hover{background:rgba(192,57,43,.22)}

/* 调休预警 · 展开明细 */
.lv-detail{margin-top:6px;padding:14px 16px;background:#fffbf2;border:1px solid #ffe1a8;border-radius:12px;color:#5b4612;font-size:12.5px;line-height:1.65;animation:popin .18s ease}
.lv-detail-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed #f0d499;gap:8px}
.lv-detail-hd b{font-weight:700;color:#92590a;font-size:13.5px}
.lv-detail-hd .meta{font-size:11.5px;color:#a07c4a;font-variant-numeric:tabular-nums}
.lv-month{margin:10px 0 4px}
.lv-month-hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:#92590a}
.lv-month-hd .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#92590a}
.lv-month-hd .sub{margin-left:auto;font-weight:500;font-size:11.5px;color:#a07c4a;font-variant-numeric:tabular-nums}
.lv-list{margin:4px 0 0 14px;display:flex;flex-direction:column;gap:4px}
.lv-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums}
.lv-row .d{flex:0 0 56px;color:#92590a;font-weight:600}
.lv-row .w{flex:0 0 32px;color:#a07c4a;font-size:11px}
.lv-row .h{flex:0 0 78px;text-align:right;font-weight:650}
.lv-row.ot{background:rgba(255,255,255,.6)}
.lv-row.ot .h{color:#3b6bff}
.lv-row.lv{background:#fde9c5;color:#7a4810}
.lv-row.lv .h{color:#b56010}
/* 已结转（被换休核销）的加班日：横线划掉 + 变灰（保留可见以便核对来源） */
.lv-row.ot.done{background:#fafafa;color:#a9a39a;text-decoration:line-through}
.lv-row.ot.done .d,.lv-row.ot.done .w{color:#bcb6ad}
.lv-row.ot.done .h{color:#b9b3aa;text-decoration:line-through}
.lv-row.ot.done .rsn{color:#b9b3aa;text-decoration:line-through}
.lv-row.ot.done .donetag{margin-left:6px;flex:0 0 auto;font-size:10.5px;color:#9a6b00;background:#fbf0d6;padding:1px 6px;border-radius:6px;text-decoration:none;font-weight:600;white-space:nowrap}
.lv-row .donetag{display:none}
.lv-row.ot.done .donetag{display:inline-block}
/* 部分核销：浅灰弱化、不加删除线，角标显示已用/当天总时长 */
.lv-row.ot.partial{background:#fbfbfa;color:#9a958c}
.lv-row.ot.partial .d,.lv-row.ot.partial .w{color:#b3aea5}
.lv-row.ot.partial .h{color:#8f8a82}
.lv-row.ot.partial .rsn{color:#b3aea5}
.lv-row.ot.partial .donetag{display:inline-block;color:#9a6b00;background:#fbf0d6}
.lv-row .rsn{flex:1 1 auto;color:#7a6a4a;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-row.empty{color:#a07c4a;font-style:italic;background:transparent;padding:4px 8px}
.lv-ft{margin-top:10px;padding-top:10px;border-top:1px dashed #f0d499;font-size:11.5px;color:#a07c4a;line-height:1.6}
.num-pos{color:var(--ok);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;font-size:12px;border-radius:8px;background:var(--line-2);color:var(--tx-2);font-weight:500;cursor:pointer;user-select:none;transition:box-shadow .12s,transform .08s}
.chip:hover{filter:brightness(.98)}
.chip:active{transform:translateY(1px)}
.chip.ot{background:#e6ecff;color:#2a4fd6}
.chip.lv{background:#e8f7ef;color:#0f8a52}
.chip.meal{background:#fff3df;color:#b57810}
.chip.carry{background:#ffefe3;color:#c2410c}
.chip.ot.active{box-shadow:inset 0 0 0 2px #3b6fe0}
.chip.lv.active{box-shadow:inset 0 0 0 2px #16a34a}
.chip.meal.active{box-shadow:inset 0 0 0 2px #e0a030}
.chip.carry.active{box-shadow:inset 0 0 0 2px #ea580c}

/* ---------- detail table ---------- */
#body{flex:1 1 auto;min-height:0;overflow:auto;padding-bottom:10px;overscroll-behavior:contain}
#body.body-list{display:flex;flex-direction:column;gap:16px;overflow:hidden;padding-bottom:0;overscroll-behavior:none}
#body.body-list > .card:not(.ot-card){flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#body.body-list .card-h{flex:0 0 auto}
#body.body-list .dt-wrap{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;scroll-padding-top:38px}
.dt-wrap{overflow:visible;background:var(--card)}
#body.body-list .dt-wrap{border-radius:0 0 var(--r) var(--r)}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
table.dt th{
  font-size:12px;font-weight:600;color:var(--tx-2);text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:2
}
table.dt th.center{text-align:center}
table.dt td{padding:0 10px;border-bottom:1px solid var(--line-2);font-size:13.5px;white-space:nowrap}
table.dt tr.rest td{background:#fffdf7}
table.dt tr.holi td{background:#fffafa}
table.dt tr:hover td{background:#f3f6ff}
table.dt tbody tr{scroll-snap-align:start}
table.dt tr.today td{box-shadow:inset 0 1px 0 var(--brand),inset 0 -1px 0 var(--brand)}
/* 上月结转来源高亮行：淡紫底 + 左侧紫条，与「上月结转」KPI 紫色呼应 */
table.dt tr.carry-in-src td{background:#f2f0ff}
table.dt tr.carry-in-src td:first-child{box-shadow:inset 3px 0 0 #6366f1}
.carry-in-note{font-size:12.5px;color:var(--tx-2);margin-right:8px}
.carry-in-note b{color:#6366f1;font-weight:600}
table.dt .cellin{
  width:100%;height:36px;border:none;background:none;padding:0 8px;font-size:13.5px;
  font-variant-numeric:tabular-nums;border-radius:0;outline:none;
}
table.dt .cellin:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--brand);border-radius:6px}
table.dt .cellin::placeholder{color:#cdd3e0}
table.dt td.dcell{padding:0 10px;font-weight:600;color:var(--tx-2);text-align:center}
table.dt td.dcell .dn{display:inline-block;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
table.dt .cellin.time-sel{height:32px;width:auto;border:1px solid var(--line-2);background:#fbfcfe;border-radius:6px;padding:0 4px;cursor:pointer}
table.dt .cellin.time-sel:focus{box-shadow:inset 0 0 0 2px var(--brand);background:#fff}
table.dt td.center{text-align:center}
/* 列间距：时长 ↔ 事由、换休·年假·外出 ↔ 事由 */
table.dt th.gap-r, table.dt td.gap-r{padding-right:24px}
/* 事由标题与文字左对齐（覆盖默认/center） */
table.dt th.left, table.dt td.left{text-align:left}
.wk{font-weight:400;color:var(--tx-3);font-size:11.5px;margin-left:4px}
.tychip{font-size:10px;padding:1px 5px;border-radius:5px;font-weight:600;margin-left:6px}
.tychip.w{background:#e9edfa;color:#4a5f9e}
.tychip.r{background:#fdefd7;color:#a86c0a}
.tychip.h{background:#fde3e3;color:#c0393d}
.oa-btn{width:100%;height:36px;font-size:14px;color:#d5dae5;transition:.14s}
.oa-btn.on{color:var(--ok)}
.oa-btn:hover{background:var(--line-2)}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx-2);padding:0 18px 14px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- settings ---------- */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:16px 18px 18px}
.fld label{display:block;font-size:13px;color:var(--tx-2);margin-bottom:6px;font-weight:500}
.fld .hint{font-size:11.5px;color:var(--tx-3);margin-top:5px;line-height:1.45}
.fld input,.fld select{
  width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fcfdff;
  transition:.14s;font-variant-numeric:tabular-nums;font-size:13.5px;
  text-align:left;text-align-last:left;   /* 统一表单文字左对齐，修正 Firefox 下 select 选中值居中导致的错位 */
}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(59,107,255,.10)}
.seg{display:flex;background:#eef0f6;border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:12.5px;color:var(--tx-2);font-weight:500;transition:.14s;display:flex;align-items:center;justify-content:center;text-align:center}
.seg button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(20,28,60,.10)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(18,24,44,.36);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:24px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);width:min(480px,100%);max-height:90vh;overflow:auto;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
/* 加班费结算卡内联的「结转方式」控制 */
.carry-ctrl{margin:2px 2px 12px;padding:13px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.carry-ctrl .seg-3{width:100%;gap:3px;margin-bottom:11px}
.carry-ctrl .seg-3 button{padding:8px 0;font-size:13px;white-space:nowrap}
.carry-ctrl .carry-manual{margin-bottom:2px}
.carry-ctrl .carry-manual .mrow{margin-bottom:12px}
.carry-ctrl .carry-manual .mrow:last-child{margin-bottom:0}
.carry-ctrl .carry-manual label{display:block;font-size:13px;color:var(--tx-2);margin-bottom:6px;font-weight:500}
.carry-ctrl .carry-manual input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fcfdff;font-variant-numeric:tabular-nums;font-size:13.5px;text-align:left;text-align-last:left}
.carry-ctrl .carry-manual input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(59,107,255,.10)}
.carry-ctrl .carry-manual .hint{font-size:11.5px;color:var(--tx-3);margin-top:5px;line-height:1.45}
.carry-ctrl .carry-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.carry-ctrl .carry-grid3 .mrow{margin-bottom:0}
.carry-ctrl .carry-grid3 label{font-size:12.5px;margin-bottom:4px}
.carry-ctrl .carry-grid3 input{height:34px;font-size:13px;padding:0 10px}
.carry-ctrl .carry-grid3 .hint{font-size:11.5px;margin-top:3px;line-height:1.4}
.carry-ctrl .carry-line{margin-top:10px;font-size:12.5px;color:var(--tx-2);line-height:1.6}
.carry-ctrl .carry-line b{color:var(--tx);font-weight:700}
.carry-ctrl .carry-line .cf{color:var(--brand)}
.hidden{display:none!important}
.btn.ot-pay{background:linear-gradient(150deg,#ff9a3c,#ff7a45);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 12px rgba(255,122,69,.28)}
.btn.ot-pay:hover{filter:brightness(1.04)}
.btn.ot-lv{background:linear-gradient(150deg,#27c08a,#12b76a);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 12px rgba(18,183,106,.26)}
.btn.ot-lv:hover{filter:brightness(1.04)}
.btn.ot-settle{background:linear-gradient(150deg,#fb923c,#ea580c);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 4px 12px rgba(234,88,12,.28)}
.btn.ot-settle:hover{filter:brightness(1.04)}
.carry-modal{width:1080px;max-width:calc(100vw - 32px);scrollbar-width:none;-ms-overflow-style:none;max-height:90vh;margin:0 auto}
.carry-modal::-webkit-scrollbar{display:none;width:0;height:0}
/* 结算面板：结算（左）与核销（右）左右两栏布局 */
.otc-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.otc-col{min-width:0}
.carry-modal .modal-h{padding-left:26px;padding-right:26px}
.carry-modal .modal-b{padding-left:26px;padding-right:26px}
.carry-modal .modal-f{padding-left:26px;padding-right:26px}
.carry-modal .otc-col > .otc-sec + .otc-sec{margin-top:18px}
.carry-modal .otc-col + .otc-col{max-height:calc(90vh - 96px);overflow-y:auto;padding-right:6px;scrollbar-width:thin}
.carry-modal .otc-col + .otc-col::-webkit-scrollbar{width:6px}
.carry-modal .otc-col + .otc-col::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
@media (max-width:820px){.otc-cols{grid-template-columns:1fr;gap:0}.carry-modal .otc-col + .otc-col{max-height:none;overflow:visible}}
.otc-tit{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.otc-tit::before{content:'';width:3px;height:13px;background:var(--brand);border-radius:2px;display:inline-block}
.modal-h{padding:20px 22px 4px;display:flex;align-items:flex-start;gap:12px}
.modal-h h3{font-size:17px;font-weight:660;letter-spacing:-.2px}
.modal-h p{font-size:13px;color:var(--tx-3);margin-top:3px}
.modal-b{padding:16px 22px}
.modal-f{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
/* 弹窗文字对齐统一：标题/说明左对齐；下拉选项居中（popover 选项原本即居中，此处作显式约束，保证所有弹窗一致） */
.modal-h h3,.modal-h p{text-align:left}
.pop-hd,.topt,.lopt,.aopt,.sopt{text-align:center}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.frow.one{grid-template-columns:1fr}

/* toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:200;
  background:#1c2030;color:#fff;padding:10px 18px;border-radius:11px;font-size:13px;
  box-shadow:0 12px 32px rgba(15,20,40,.28);animation:up .2s ease;
}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

.empty{padding:56px 20px;text-align:center;color:var(--tx-3);font-size:14px}
.empty .ic{font-size:34px;opacity:.35;margin-bottom:10px}

@media (max-width:1080px){
  .cols{grid-template-columns:1fr}
}
@media (max-width:680px){
  .wrap,.topbar-in{padding-left:14px;padding-right:14px}
  .grid-kpi{gap:5px}
  .cel{min-height:64px}
  .hide-sm{display:none}
  /* 标签栏可横向滑动，避免拥挤 */
  .tabs{overflow-x:auto;flex-wrap:nowrap;max-width:100%;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  /* 明细表横向滚动 + 冻结首列（日期），窄屏更好用 */
  #body.body-list .dt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.dt{width:max-content;min-width:100%}
  table.dt th:first-child,table.dt td:first-child{
    position:sticky;left:0;z-index:3;background:var(--card);
    box-shadow:1px 0 0 var(--line);
  }
  table.dt thead th:first-child{background:#f7f9fc;z-index:4}
  table.dt tr:hover td:first-child{background:#fafbfe}
  table.dt .cellin{height:40px;font-size:16px}
}
@media print{
  .topbar,.no-print{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}

/* ---------- auto meal badge & read-only note ---------- */
.auto-badge{
  display:inline-flex;align-items:center;justify-content:center;min-width:34px;
  padding:3px 8px;border-radius:7px;background:#fff7e6;color:#b57810;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
}
.auto-badge.zero{background:transparent;color:#c2c8d6}
.auto-badge.meal-toggle{cursor:pointer;user-select:none;transition:filter .12s,box-shadow .12s}
.auto-badge.meal-toggle:hover{filter:brightness(.97);box-shadow:0 0 0 2px rgba(229,168,48,.35)}
.auto-badge.meal-toggle:active{filter:brightness(.93)}
.readonly-note{
  font-size:12px;color:var(--tx-3);background:var(--bg);border:1px dashed var(--line);
  border-radius:8px;padding:9px 10px;line-height:1.5;
}

/* ---------- KPI 高亮配色（已在上方 KPI 区块统一定义，含图标） ---------- */
.lvtag{display:inline-block;margin:0 6px 2px 0;padding:2px 8px;border-radius:6px;background:#eef2fb;color:#3b557e;font-size:11.5px}
.lvtag b{color:#274690}
/* 换休核销台账弹窗 */
.llg-sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--tx-2);margin:4px 0 6px}
.llg-sum b{font-variant-numeric:tabular-nums;color:var(--tx)}
.llg-lv{border:1px solid var(--line);border-radius:10px;padding:7px 12px;margin-bottom:7px;background:#fbfcfe}
.llg-lv-hd{font-size:13px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.llg-pair{font-size:12px;color:var(--tx-2);margin-top:4px;padding:2px 0 2px 10px;border-left:2px solid #d7deea;line-height:1.6}
.llg-tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;background:#eef2fb;color:#3b557e}
.llg-tag.man{background:#e8f7ee;color:#1a9d50}
.llg-warn{color:#c0393d;background:#fef2f2;border-radius:6px;padding:2px 8px;font-size:11.5px;display:inline-block}
.llg-cash{color:#c2410c;background:#ffefe3;border-radius:6px;padding:2px 8px;font-size:11.5px;display:inline-block}
.llg-pool-hd{margin:12px 0 5px;font-size:12.5px;font-weight:600;color:var(--tx-2)}
.llg-pl{display:grid;grid-template-columns:84px 56px 52px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line-2)}
.llg-pl .dt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.llg-pl .tp{color:var(--tx-3);white-space:nowrap}
.llg-pl .hh{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.llg-pl .ur{color:var(--tx-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.llg-pl .st{white-space:nowrap}
/* 时长输入去掉原生上下三角按钮 */
input[data-f="hours"]::-webkit-inner-spin-button,
input[data-f="hours"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[data-f="hours"]{-moz-appearance:textfield}

/* 换休列：与其它列保持统一内边距，间隔更均匀 */
table.dt th.leave-col,
table.dt td.leave-col{border-right:none}

/* ---------- 进入密码：访问保护锁屏 ---------- */
#lockScreen{
  position:fixed;inset:0;z-index:9999;display:none;
  align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%,#eef2ff 0%,#f4f6fa 60%);
  padding:24px;
}
body.locked #lockScreen{display:flex}
body.locked .topbar,
body.locked .wrap{display:none}
.lock-card{
  width:340px;max-width:92vw;background:#fff;border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow-lg);padding:36px 30px 30px;text-align:center;
  animation:popin .18s ease;
}
.lock-logo{margin-bottom:14px}
.lock-logo .mk{
  width:56px;height:56px;border-radius:16px;display:inline-grid;place-items:center;
  background:linear-gradient(140deg,#4c7bff,#7a5cff);color:#fff;font-size:24px;font-weight:700;
  box-shadow:0 6px 18px rgba(76,123,255,.32);
}
#lockScreen h2{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-top:6px}
.lock-sub{font-size:13px;color:var(--tx-3);margin:6px 0 20px}
#lockPass{
  width:100%;box-sizing:border-box;text-align:center;font-size:15px;
  padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fbfcfe;
  outline:none;transition:.14s;
}
#lockPass:focus{box-shadow:inset 0 0 0 2px var(--brand);border-color:var(--brand);background:#fff}
#lockBtn{width:100%;margin-top:12px;padding:12px;border-radius:11px;font-weight:650;font-size:15px;justify-content:center}
.lock-err{min-height:18px;margin-top:10px;font-size:12.5px;color:#e5484d}
.btn:disabled{opacity:.42;cursor:not-allowed;background:#f0f2f7;color:#a8afbf;box-shadow:none}
/* 顶栏刷新按钮 */
.tbtn{width:32px;height:32px;flex:0 0 auto;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx-2);background:var(--card);border:1px solid var(--line);transition:.14s}
.tbtn:hover{background:var(--line-2);color:var(--tx)}
.tbtn:active{transform:scale(.94)}
@keyframes popin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

function load() {
  // 以 SEED（2026 起）为基准，携带正确的结转配置(carryMode/carryOutManual)
  const base = { version: 1, settings: Object.assign({}, DEF_SETTINGS), months: JSON.parse(JSON.stringify(SEED)) };
  let raw = null;
  try { raw = JSON.parse(store.getItem(KEY)); } catch (e) {}
  if (raw && raw.months) {
    base.settings = Object.assign({}, DEF_SETTINGS, raw.settings || {});
    Object.keys(raw.months).forEach(k => {
      if (k < MIN_KEY) return;                       // 丢弃 2026 年以前的旧缓存
      const rm = raw.months[k];
      if (!base.months[k]) { base.months[k] = rm; return; }
      // 2026+ 月份：优先保留种子的结转配置，叠加用户可能编辑过的日期明细
      base.months[k].days = Object.assign({}, rm.days || {}, base.months[k].days || {});

  Object.keys(base.months).forEach(k => { if (k < MIN_KEY) delete base.months[k]; });

  cur = ks.includes(nowK) ? nowK : (ks[ks.length - 1] || nowK);

function monthKeys() { return Object.keys(DB.months).sort(); }
function M(k) { return DB.months[k] || (DB.months[k] = { days: {} }); }
function prevKey(k) { const [y, m] = k.split('-').map(Number); return m === 1 ? mk(y - 1, 12) : mk(y, m - 1); }
function nextKey(k) { const [y, m] = k.split('-').map(Number); return m === 12 ? mk(y + 1, 1) : mk(y, m + 1); }
function daysIn(k) { const [y, m] = k.split('-').map(Number); return new Date(y, m, 0).getDate(); }

/* ======================= 日期类型判定 ======================= */
function dayType(key, d) {
  const [y, m] = key.split('-').map(Number);
  const rec = M(key).days[d];
  if (rec && rec.type) return rec.type;                 // 手动覆盖优先
  const md = pad(m) + '-' + pad(d);
  const s = DB.settings;
  const ex = t => (s[t] || '').split(/[,，\s]+/).filter(Boolean);
  if (ex('extraHoliday').includes(md)) return 'holi';
  if (ex('extraWorkday').includes(md)) return 'work';
  const H = HOLIDAY[y];
  if (H) {
    if (H.legal.includes(md)) return 'holi';
    if (H.work.includes(md)) return 'work';
    if (H.rest.includes(md)) return 'rest';
  }
  const w = new Date(y, m - 1, d).getDay();
  return (w === 0 || w === 6) ? 'rest' : 'work';
}

/* ==================== 时长自动计算 ==================== */
function parseHM(t) {
  if (!t) return null;
  const m = String(t).trim().match(/^(\d{1,2})\s*[:：.]\s*(\d{1,2})$/);
  if (m) return (+m[1]) * 60 + (+m[2]);
  const h = String(t).trim().match(/^(\d{1,2})$/);
  return h ? (+h[1]) * 60 : null;
}
function autoHours(start, end) {
  const a = parseHM(start), b = parseHM(end);
  if (a === null || b === null) return null;
  let mins = b - a;
  if (mins <= 0) mins += 24 * 60;                       // 跨零点
  mins -= (+DB.settings.breakMin || 0);
  if (mins <= 0) return 0;
  const step = (+DB.settings.roundStep || 0.5) * 60;
  const md = DB.settings.roundMode;
  const n = md === 'ceil' ? Math.ceil(mins / step) : md === 'round' ? Math.round(mins / step) : Math.floor(mins / step);
  return +(n * step / 60).toFixed(2);
}
function hoursOf(key, d) {
  const r = M(key).days[d]; if (!r) return 0;
  if (r.hours !== undefined && r.hours !== null && r.hours !== '') return +r.hours || 0;
  return autoHours(r.start, r.end) || 0;
}

/* ======================= 核心计算引擎 ======================= */
const rateOf = () => {
  const s = DB.settings, dh = +s.dailyHours || 8;
  return { work: +s.rateWork || 0, rest: (+s.rateRest || 0) / dh, holi: (+s.rateHoli || 0) / dh };
};

/** 计算某月，depth 防止链式递归过深 */
function compute(key, depth) {
  depth = depth || 0;
  const mo = M(key), n = daysIn(key);
  const gain = { work: 0, rest: 0, holi: 0 };           // 本月新增加班时长
  const otCnt = { work: 0, rest: 0, holi: 0 };           // 本月各类型加班记录天数
  let leaveTotal = 0, mealCount = 0, otDays = 0, annualUse = 0;
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d]; if (!r) continue;
    const h = hoursOf(key, d), t = dayType(key, d);
    if (h > 0) { gain[t] += h; otCnt[t]++; otDays++; }
    leaveTotal += +r.leaveH || 0;                       // 工作日/双休日/节假日均可填换休
    // 餐补规则：工作日加班≥1.5h 自动计 1 次；休息日/节假日按手动填写
    const meal = t === 'work' ? (h >= 1.5 ? 1 : 0) : (+r.meal || 0);
    mealCount += meal;
    annualUse += +r.annual || 0;
  }
  // --- 上月结转（继承）---
  let carryIn = { work: 0, rest: 0, holi: 0 };
  if (mo.carryIn) carryIn = Object.assign({ work: 0, rest: 0, holi: 0 }, mo.carryIn);
  else if (depth < 36) {
    const pk = prevKey(key);
    // 统计起点前的月份不参与结转（「从 7 月开始计算」，之前不用理会）
    if (pk >= MIN_KEY && DB.months[pk]) carryIn = compute(pk, depth + 1).carryOut;
  }
  // --- 换休按 FIFO 消耗：先上月结转，再本月新增；同层按 工作日→双休日→节假日 ---
  const order = ['work', 'rest', 'holi'];
  const carryInTotal = +(carryIn.work + carryIn.rest + carryIn.holi).toFixed(2);
  const usedPrev = { work: 0, rest: 0, holi: 0 }, usedCur = { work: 0, rest: 0, holi: 0 };
  let need = leaveTotal;
  for (const t of order) { const u = Math.min(need, carryIn[t]); usedPrev[t] = u; need -= u; }
  for (const t of order) { const u = Math.min(need, gain[t]); usedCur[t] = u; need -= u; }
  const leaveShort = +need.toFixed(2);                  // 换休超出可用时长的部分
  // --- 可支配时长 ---
  const avail = {}, used = {};
  order.forEach(t => { used[t] = usedPrev[t] + usedCur[t]; avail[t] = +(carryIn[t] + gain[t] - used[t]).toFixed(2); });
  const gainTotal = order.reduce((s, t) => s + gain[t], 0);
  const availTotal = +(avail.work + avail.rest + avail.holi).toFixed(2);
  // --- 结转下月 ---
  const mode = mo.carryMode || DB.settings.carryMode;
  const carryOut = { work: 0, rest: 0, holi: 0 };
  // 跨月核销口径：超 30 天未换休已自动转加班费(autoCash)的时长不可再结转（B 方案）
  // 把已算好的上半部分结果传给 leaveLedger，避免双向递归，同时保证口径一致
  let autoCashByType = { work: 0, rest: 0, holi: 0 };
  let expiredByType = { work: 0, rest: 0, holi: 0 };
  try {
    const preC = { carryIn, carryInTotal, gain, gainTotal, leaveTotal, leaveShort, used, usedPrev, usedCur, avail, availTotal };
    const L = leaveLedger(key, preC);
    if (L && L.autoCashByType) autoCashByType = L.autoCashByType;
    if (L && L.expiredByType) expiredByType = L.expiredByType;
  } catch (e) {}
  // 这两类时长已自动折现计入加班费，不可再作为结转上限：
  //  - autoCash：距换休日 >30 天未被核销（核销窗口外）
  //  - expired ：产生日距基准日 > 调休有效期天数仍未换休（按天过期）
  const carryCap = {};
  order.forEach(t => { carryCap[t] = +Math.max(0, avail[t] - (autoCashByType[t] || 0) - (expiredByType[t] || 0)).toFixed(2); });
  // 调休池过期（统计自 2026-07，按有效期 N 个月）：过期月之后不再结转，剩余全部折现计入加班费
  const N = +DB.settings.leaveExpireMonths || 0;
  let lvExpired = false, lvExpiredCash = 0;
  if (N > 0) {
    const exp = monthEnd(2026, 7, N), ey = exp.getFullYear(), em = exp.getMonth() + 1;
    const [cy, cm] = key.split('-').map(Number);
    if (cy > ey || (cy === ey && cm > em)) lvExpired = true;   // cur 在到期月之后即过期
  }
  order.forEach(t => {
    let v = 0;
    if (t === 'work' && !lvExpired) {   // 仅工作日时长作调休结转；过期后工作日也不再结转
      if (mode === 'all') v = avail[t];
      else if (mode === 'manual') v = Math.min(+((mo.carryOutManual || {})[t] || 0), avail[t]);
    } else if ((t === 'rest' || t === 'holi') && mode === 'manual') {
      // 双休/节假日默认折现，但允许在自定义中手动选择结转
      v = Math.min(+((mo.carryOutManual || {})[t] || 0), avail[t]);
    }
    v = Math.min(v, carryCap[t]);        // autoCash 不可结转，强制封顶
    carryOut[t] = +Math.max(0, v).toFixed(2);
  });
  if (lvExpired) lvExpiredCash = +(avail.work).toFixed(2);   // 工作日层全部折现（含上月遗留的过期调休）
  // --- 折现 ---
  const R = rateOf(), cash = {}, amount = {};
  let otPay = 0;
  const autoCashTotal = +order.reduce((s, t) => s + (autoCashByType[t] || 0), 0).toFixed(2);
  const expiredTotal = +order.reduce((s, t) => s + (expiredByType[t] || 0), 0).toFixed(2);
  order.forEach(t => {
    cash[t] = +(avail[t] - carryOut[t]).toFixed(2);
    amount[t] = +(cash[t] * R[t]).toFixed(2);
    otPay += amount[t];
  });
  const mealPay = +(mealCount * (+DB.settings.mealRate || 0)).toFixed(2);
  return {
    key, gain, gainTotal: +gainTotal.toFixed(2), carryIn,
    carryInTotal,
    leaveTotal, leaveShort, used, usedPrev, usedCur, avail,
    availTotal,
    carryCap, carryOut, carryOutTotal: +(carryOut.work + carryOut.rest + carryOut.holi).toFixed(2),
    cash, cashTotal: +(cash.work + cash.rest + cash.holi).toFixed(2),
    autoCash: autoCashTotal, autoCashByType, expiredCash: expiredTotal, expiredByType,
    amount, otPay: +otPay.toFixed(2), mealCount, mealPay, otCnt,
    total: +(otPay + mealPay).toFixed(2), otDays, annualUse, rates: R, mode, lvExpired, lvExpiredCash
  };
}

    const srcLbl = e => e.earlier ? '更早月份结转' : `${e.m}月${e.d}日`;

    const sumHTML = `<div class="llg-sum">

        ${d.expiredCash > 0.001 ? `<span class="llg-cash">超${Math.round(+DB.settings.leaveExpireDays || 0)}天(产生日)过期转加班费 <b>${hf(d.expiredCash)}h</b></span>` : ''}

/* ============ 换休核销台账：换休 ↔ 加班 一一对应 ============ */
/* 核销规则：30 天内的加班才能核销换休（距换休日超过 30 天的加班自动记为加班费，不再参与配对）；
   历史记录中手动指定来源（leaveSrc）的优先；其余按 FIFO 自动配对
   （先上月结转池，再本月加班池；同池内 工作日→双休日→节假日、同类型按日期先产生先消耗）。
   年假（r.annual）不参与核销（独立额度）。 */
function leaveLedger(key, preC) {
  const [y, m] = key.split('-').map(Number);
  const order = ['work', 'rest', 'holi'];
  const c = preC || compute(key);
  const fromPre = !!preC;
  const n = daysIn(key), mo = M(key);
  const tOrd = { work: 0, rest: 1, holi: 2 };
  /* 30 天核销规则 */
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const mEnd = new Date(y, m - 1, n);                       // 本月最后一天
  const ref = mEnd > today ? today : mEnd;                  // “再无可能被消耗”的判定基准（历史月=月末，当月/未来月=今天）
  const eDate = e => new Date(e.y, e.m - 1, e.d || 1);      // 更早月份结转（日期未知）按上月 1 日计
  const overDue = (e, ld) => (ld - eDate(e)) / 86400000 > 30;   // 距换休日超 30 天 → 不可核销
  // 换休条目（所有 leaveH > 0 的行，与计算引擎口径一致）
  const leaves = [];
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d];
    if (!r || !(+r.leaveH > 0)) continue;
    leaves.push({
      d, h: +r.leaveH, src: r.leaveSrc || '', reason: r.leaveReason || '',
      pairs: [], short: 0, manual: !!(r.leaveSrc && String(r.leaveSrc).startsWith('D'))
    });
  }
  leaves.sort((a, b) => a.d - b.d);
  // 结转池：上月加班中实际未被上月换休核销的剩余部分
  // 先模拟上月换休的 FIFO 消耗（先上月结转，后上月新增；同类型按日期），剩余即「可结转」归属
  const pk = prevKey(key);
  const [py, pm] = pk.split('-').map(Number);
  const prevOT = [];
  let prevLeaveTotal = 0;
  if (DB.months[pk]) {
    const pmo = M(pk), pn = daysIn(pk);
    for (let d = 1; d <= pn; d++) {
      const r = pmo.days[d]; if (!r) continue;
      const h = hoursOf(pk, d); if (h > 0) prevOT.push({ d, h, t: dayType(pk, d), reason: r.reason || '' });
      prevLeaveTotal += +r.leaveH || 0;
    }
  }
  prevOT.sort((a, b) => tOrd[a.t] - tOrd[b.t] || a.d - b.d);
  // 模拟上月换休消耗：先 carryIn（来自 c.carryIn），再 prevOT 按日期升序
  let need = prevLeaveTotal;
  const pCarryInLeft = { work: c.carryIn.work, rest: c.carryIn.rest, holi: c.carryIn.holi };
  for (const t of order) { const u = Math.min(need, pCarryInLeft[t]); pCarryInLeft[t] = +(pCarryInLeft[t] - u).toFixed(2); need -= u; }
  const pLeft = {}; prevOT.forEach(e => { pLeft[e.d] = e.h; });
  for (const t of order) {
    prevOT.filter(e => e.t === t).forEach(e => {
      if (need <= 0.001) return;
      const u = Math.min(need, pLeft[e.d]);
      pLeft[e.d] = +(pLeft[e.d] - u).toFixed(2); need -= u;
    });
  }
  // 结转归属：取上月剩余，按日期降序（FIFO 下剩余的是较晚加班）
  let prevRemain = prevOT.filter(e => pLeft[e.d] > 0.001).map(e => ({ d: e.d, h: pLeft[e.d], t: e.t, reason: e.reason }));
  prevRemain.sort((a, b) => tOrd[a.t] - tOrd[b.t] || b.d - a.d);
  let cap = c.carryInTotal;
  const carryPool = prevRemain.map(e => {
    if (cap <= 0.001) return null;
    const take = +Math.min(e.h, cap).toFixed(2);
    cap = +(cap - take).toFixed(2);
    return { y: py, m: pm, d: e.d, h: take, t: e.t, reason: e.reason, used: [], left: take, earlier: false };
  }).filter(Boolean);
  const prevRemainTotal = +prevRemain.reduce((s, e) => s + e.h, 0).toFixed(2);
  if (c.carryInTotal > prevRemainTotal + 0.001)   // 结转额超过上月剩余总量 → 来自更早月份的遗留结转
    carryPool.push({ y: py, m: pm, d: 0, h: +(c.carryInTotal - prevRemainTotal).toFixed(2), t: 'work', reason: '', used: [], left: +(c.carryInTotal - prevRemainTotal).toFixed(2), earlier: true });
  // 本月池：本月加班日（同排序）
  const curPool = [];
  for (let d = 1; d <= n; d++) {
    const r = mo.days[d]; if (!r) continue;
    const h = hoursOf(key, d); if (h <= 0) continue;
    curPool.push({ y, m, d, h, t: dayType(key, d), reason: r.reason || '', used: [], left: h, earlier: false });
  }
  curPool.sort((a, b) => tOrd[a.t] - tOrd[b.t] || a.d - b.d);
  // FIFO 消耗（先结转池，再本月池；onlyCarry=true 时仅结转池；ld=换休日，仅消耗距其 30 天内的加班）
  const fifo = (rem, onlyCarry, ld) => {
    const parts = [];
    const pick = pool => { for (let i = 0; i < pool.length; i++) { const e = pool[i]; if (e.left > 0.001 && !overDue(e, ld)) return e; } return null; };
    while (rem > 0.001) {
      let e = pick(carryPool);
      if (!e && !onlyCarry) e = pick(curPool);
      if (!e) break;
      const take = +Math.min(rem, e.left).toFixed(2);
      parts.push({ e, take });
      e.left = +(e.left - take).toFixed(2);
      rem = +(rem - take).toFixed(2);
    }
    return { parts, rem };
  };
  const warnings = [];
  // 1) 手动指定「当月某日」的换休：优先核销指定加班日（须在换休日 30 天内）
  leaves.filter(l => l.manual).forEach(l => {
    const sd = +String(l.src).slice(1);
    const e = curPool.find(x => x.d === sd);
    const ld = new Date(y, m - 1, l.d);
    let rem = l.h;
    if (e && e.left > 0.001 && !overDue(e, ld)) {
      const take = +Math.min(rem, e.left).toFixed(2);
      l.pairs.push({ e, take, manual: true });
      e.used.push({ l, take });
      e.left = +(e.left - take).toFixed(2);
      rem = +(rem - take).toFixed(2);
    }
    if (rem > 0.001) {
      if (e && overDue(e, ld)) warnings.push(`${m}月${l.d}日 换休指定的「${sd}日加班」距换休超30天，已自动转加班费，改按30天内加班 FIFO 补足`);
      else warnings.push(`${m}月${l.d}日 换休指定的「${sd}日加班」${e ? '剩余时长不足' : '不存在或无时长'}，缺 ${hf(rem)}h 已按 FIFO 补足`);
      const r2 = fifo(rem, false, ld);
      r2.parts.forEach(p => { l.pairs.push({ e: p.e, take: p.take, manual: false }); p.e.used.push({ l, take: p.take }); });
      l.short = r2.rem;
    }
  });
  // 2) 指定「上月结转」的换休：仅从结转池 FIFO（同样受 30 天窗口限制）
  leaves.filter(l => l.src === 'carry').forEach(l => {
    const r2 = fifo(l.h, true, new Date(y, m - 1, l.d));
    r2.parts.forEach(p => { l.pairs.push({ e: p.e, take: p.take, manual: false }); p.e.used.push({ l, take: p.take }); });
    if (r2.rem > 0.001) warnings.push(`${m}月${l.d}日 换休指定「上月结转」但结转池无30天内可用余额（或余额不足），缺 ${hf(r2.rem)}h`);
    l.short = r2.rem;
  });
  // 3) 未指定的换休：结转池 → 本月池 FIFO（仅消耗距换休日 30 天内的加班）
  leaves.filter(l => !l.manual && l.src !== 'carry').forEach(l => {
    const r2 = fifo(l.h, false, new Date(y, m - 1, l.d));
    r2.parts.forEach(p => { l.pairs.push({ e: p.e, take: p.take, manual: false }); p.e.used.push({ l, take: p.take }); });
    l.short = r2.rem;
  });
  if (c.leaveShort > 0.001) warnings.push(`本月换休合计比可用加班时长多 ${hf(c.leaveShort)}h（引擎已标红提示）`);
  // 调休有效期（按天）：加班/调休产生超过 N 天仍未换休核销的，强制折现计入加班费（不可结转）
  // 以「加班产生日」为锚点，与用户何时换休无关；优先于下方「距换休日>30」窗口，避免重复统计
  let expiredCash = 0; const expiredByType = { work: 0, rest: 0, holi: 0 };
  const EXP = +DB.settings.leaveExpireDays || 0;
  carryPool.concat(curPool).forEach(e => {
    if (EXP > 0 && e.left > 0.001 && (ref - eDate(e)) / 86400000 > EXP) {
      e.expired = true; expiredCash = +(expiredCash + e.left).toFixed(2);
      expiredByType[e.t] = +(expiredByType[e.t] + e.left).toFixed(2);
    }
  });
  // 超 30 天仍未被消耗（距换休日>30 且该条未触发按天过期）的加班 → 自动记为加班费
  let autoCash = 0; const autoCashByType = { work: 0, rest: 0, holi: 0 };
  carryPool.concat(curPool).forEach(e => {
    if (!e.expired && e.left > 0.001 && (ref - eDate(e)) / 86400000 > 30) {
      e.cash = true; autoCash = +(autoCash + e.left).toFixed(2);
      autoCashByType[e.t] = +(autoCashByType[e.t] + e.left).toFixed(2);
    }
  });
  const usedCarry = +carryPool.reduce((s, e) => s + (e.h - e.left), 0).toFixed(2);
  const usedCur = +curPool.reduce((s, e) => s + (e.h - e.left), 0).toFixed(2);
  const totalShort = +leaves.reduce((s, l) => s + l.short, 0).toFixed(2);
  if (totalShort > c.leaveShort + 0.001) warnings.push(`按30天规则另有 ${hf(+(totalShort - c.leaveShort).toFixed(2))}h 换休找不到30天内的加班来源（对应加班已自动转加班费）`);
  return { leaves, carryPool, curPool, usedCarry, usedCur, totalShort, autoCash, autoCashByType, expiredCash, expiredByType, warnings, c };
}

function isToday(key, d) {

// 时间下拉选项：00:00 ~ 23:30，每 30 分钟一档；若当前选中值不在网格内（如 18:10），自动补入并保持选中
function addHour(t, h) {
  if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return '';
  let [hh, mm] = t.split(':').map(Number);
  hh += h; if (hh > 23) hh = 23;
  return pad(hh) + ':' + pad(mm);
}
function timeOptions(sel) {
  let opts = [];
  for (let h = 0; h < 24; h++) for (const mm of [0, 30]) opts.push(pad(h) + ':' + pad(mm));
  if (sel && typeof sel === 'string' && /^\d{1,2}:\d{1,2}$/.test(sel) && !opts.includes(sel)) opts.push(sel);
  opts.sort();
  const empty = (sel === '' || sel == null) ? ' selected' : '';
  let o = `<option value=""${empty}>—</option>`;
  for (const v of opts) o += `<option value="${v}"${sel === v ? ' selected' : ''}>${v}</option>`;
  return o;
}

// 调休对应明细：按来源(上月结转 / 当月某日 / 未指定)汇总，用于「一一对应」记录
function leaveBreakdown(key) {
  const n = daysIn(key), map = {};
  for (let d = 1; d <= n; d++) {
    const r = M(key).days[d]; if (!r) continue;
    if (dayType(key, d) !== 'work') continue;
    const lv = +r.leaveH || 0; if (lv <= 0) continue;
    const src = r.leaveSrc || '';

  }

    let lbl = s === 'carry' ? '上月结转' : (s.startsWith('D') ? (+s.slice(1)) + '日' : '未指定');
    parts.push(`<span class="lvtag">${lbl} <b>${hf(map[s])}h</b></span>`);
  });
  return parts.join('');
}

const ALL_TIMES = (() => { const a = []; for (let h = 0; h < 24; h++) for (const mm of [0, 30]) a.push(pad(h) + ':' + pad(mm)); return a; })();

/* 滚轮滑动选择：滚动时让处于容器正中（中心）的选项高亮 */
function scrollHighlightMark(pop, itemSel) {
  const items = [...pop.querySelectorAll(itemSel)];
  if (!items.length) return;
  const cr = pop.getBoundingClientRect();
  const center = cr.top + cr.height / 2;
  let best = null, bestD = Infinity;
  for (const it of items) {
    const r = it.getBoundingClientRect();
    const c = r.top + r.height / 2;
    const d = Math.abs(c - center);
    if (d < bestD) { bestD = d; best = it; }
  }
  items.forEach(it => it.classList.toggle('on', it === best));
}
function attachScrollHighlight(pop, itemSel) {

}
// 顶部/底部仅留少量内边距，去掉大片空白，同时保留首尾滚动空间

  if (!bot) { bot = document.createElement('div'); bot.className = 'sel-sp-bot'; pop.appendChild(bot); }
  top.style.height = sp + 'px'; bot.style.height = sp + 'px';
}
function centerOn(pop, el) { if (!el) return; pop.scrollTop = el.offsetTop - pop.clientHeight / 2 + el.clientHeight / 2; }

    const pk = prevKey(cur);
    if (!DB.months[pk]) { toast('无上一月数据'); return; }
    carryInReturn = cur;          // 记住进入前的月份，供退出返回
    cur = pk; tab = 'list'; carryInView = true; listFilter = null;
    render();
    return;
  }
  // 在「上月结转来源」视图下点其他 KPI：自动退出来源视图，回到原本月份，再应用新筛选
  if (carryInView) {
    carryInView = false;
    if (carryInReturn) { cur = carryInReturn; carryInReturn = null; }
  }
  if (tab !== 'list') { tab = 'list'; renderTop(); }
  setListFilter(f || null);
  renderKPI();  // 刷新 KPI 自身的 active 高亮
}

function render() { renderTop(); renderKPI(); renderAlerts(); renderBody(); }

/* ---------- 调休 / 年假到期预警 ---------- */
// 最早产生「仍可用可调休额度」的月份（沿结转链向前追溯）
function leaveOriginMonth(key) {
  let k = key;
  while (true) {
    const pk = prevKey(k);
    if (!DB.months[pk]) break;
    const c = compute(pk);
    if (c.carryOutTotal <= 0.001 && c.gainTotal <= 0.001) break; // 上月未向下传递额度 → 当前月为起点
    k = pk;
  }
  return k;
}
// 某月 +add 个月后的月底日期
function monthEnd(y, m, add) {
  let mm = m + add, yy = y;
  while (mm > 12) { mm -= 12; yy++; }
  return new Date(yy, mm - 1, daysIn(yy + '-' + pad(mm)));
}
function buildAlerts() {
  const out = [];
  const c = compute(cur);
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // 年假
  const annTotal = +DB.settings.annualTotal || 0;
  let annUsed = 0;
  Object.keys(DB.months).forEach(k => { const ds = (DB.months[k] || {}).days || {}; Object.keys(ds).forEach(d => { annUsed += +((ds[d] || {}).annual) || 0; }); });
  const annRemain = Math.max(0, annTotal - annUsed);
  if (annRemain > 0 && (now.getMonth() + 1) >= 11) {
    out.push({ key: 'ann_warn_' + Math.round(annRemain), cls: 'warn', ic: '🗓', html: `<b>年假剩余 ${hf(annRemain)} 天</b>，将于 <b>12 月 31 日</b> 清零（按自然年），请尽快安排使用。` });
  } else if (annTotal > 0 && annRemain <= 0) {
    out.push({ key: 'ann_done', cls: 'info', ic: '🗓', html: `年假额度（${hf(annTotal)} 天）已用尽。` });
  }
  // 调休到期（估算：统计自 2026年7月，按有效期 N 个月推算）
  const N = +DB.settings.leaveExpireMonths || 0;
  const avail = c.availTotal;
  if (N > 0 && avail > 0.001) {
    const originKey = '2026-07';
    const [oy, om] = originKey.split('-').map(Number);
    const exp = monthEnd(oy, om, N);
    const daysLeft = Math.round((exp - today0) / 86400000);
    const originLbl = `${oy}年${om}月`;
    const expLbl = `${exp.getFullYear()}-${pad(exp.getMonth() + 1)}-${pad(exp.getDate())}`;
    if (daysLeft <= 30) {
      out.push({ key: 'lv_warn_' + Math.round(avail), cls: 'warn', ic: '🌴', html: `可调休约 <b>${hf(avail)}h</b> 将于 <b>${expLbl}</b> 到期（按 ${N} 个月有效期估算，还剩 ${daysLeft} 天），建议尽快使用。` });
    }
  }
  return out;
}

let lvExpanded = false; // 调休预警展开状态（不持久化，刷新即收起）

function renderAlerts() {
  const el = $('#alerts'); if (!el) return;
  const read = DB.settings.alertRead || [];
  const list = buildAlerts().filter(a => a.key.startsWith('lv_warn_') || !read.includes(a.key)); // 可调休提醒不做「已读」隐藏，始终显示
  el.innerHTML = list.map(a => {
    const isLv = a.key.startsWith('lv_warn_');
    const roleAttr = isLv ? ` role="button" tabindex="0" aria-expanded="${lvExpanded ? 'true' : 'false'}"` : '';
    const clickAttr = isLv ? ` onclick="toggleLvDetail()"` : '';
    const clsExtra = isLv ? (lvExpanded ? ' clickable expanded' : ' clickable') : '';
    const caret = isLv ? '<span class="caret">▾</span>' : '';
    const hint = isLv ? `<span class="hint">点击展开明细</span>` : '';
    const titleAttr = isLv ? ' title="点击查看调休来源明细"' : '';
    return `<div class="alert ${a.cls}${clsExtra}"${clickAttr}${roleAttr}${titleAttr}>
      <span class="ai">${a.ic}</span>
      <div>${a.html}</div>
      ${hint}
      ${caret}
      ${isLv ? '' : `<button class="alert-x" onclick="event.stopPropagation();dismissAlert('${a.key}')" title="已读，不再提示">✓</button>`}
    </div>`;
  }).join('');
  if (lvExpanded) {
    const wrap = document.createElement('div');
    wrap.id = 'lvDetail';
    wrap.innerHTML = buildLvDetail();
    el.appendChild(wrap);
  }
}
function dismissAlert(k) {
  const read = DB.settings.alertRead = DB.settings.alertRead || [];
  if (!read.includes(k)) read.push(k);
  // 调休预警被关掉时，连带收起详情面板，避免详情孤儿漂浮
  if (k.startsWith('lv_warn_')) lvExpanded = false;
  save(false);
  renderAlerts();
}
function toggleLvDetail() {
  lvExpanded = !lvExpanded;
  renderAlerts();
}
/* 调休预警展开明细：列出每个月的加班日 + 换休日，方便知道 21h 是从哪天累计来的 */
function buildLvDetail() {
  const c = compute(cur);
  const N = +DB.settings.leaveExpireMonths || 0;
  if (N <= 0) return '';
  const originKey = '2026-07';
  const [oy, om] = originKey.split('-').map(Number);
  const [cy, cm] = cur.split('-').map(Number);
  const exp = monthEnd(oy, om, N);
  const expLbl = `${exp.getFullYear()}-${pad(exp.getMonth() + 1)}-${pad(exp.getDate())}`;
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  // 遍历从 origin → 当前月的所有月份
  const months = [];
  for (let y = oy, m = om; y < cy || (y === cy && m <= cm); ) {
    months.push(y + '-' + pad(m));
    m++; if (m > 12) { m = 1; y++; }
  }
  // 跨月收集「被换休核销的加班日」：doneMap[monthKey][day] = {used,total}
  const doneMap = {};
  const markDone = (mk, d, used, total) => {
    if (!doneMap[mk]) doneMap[mk] = {};
    const prev = doneMap[mk][d];
    if (!prev) doneMap[mk][d] = { used: +used, total: +total };
    else { prev.used = +(prev.used + used).toFixed(2); prev.total = +(prev.total + total).toFixed(2); }
  };
  months.forEach(k => {
    let lg = null;
    try { lg = leaveLedger(k); } catch (e) { lg = null; }
    if (!lg) return;
    // 当月加班池：left 归零 → 被当月换休消耗
    (lg.curPool || []).forEach(e => { if (e.left <= 0.001) markDone(k, e.d, e.h, e.h); else if (e.left < e.h - 0.001) markDone(k, e.d, +(e.h - e.left).toFixed(2), e.h); });
    // 结转池：left 归零 → 上月结转到本月的加班被本月换休消耗（来源日 = e.y/e.m/e.d）
    (lg.carryPool || []).forEach(e => { if (e.left <= 0.001) markDone(e.y + '-' + pad(e.m), e.d, e.h, e.h); else if (e.left < e.h - 0.001) markDone(e.y + '-' + pad(e.m), e.d, +(e.h - e.left).toFixed(2), e.h); });
  });
  const blocks = months.map(k => {
    const n = daysIn(k);
    const days = (M(k) || {}).days || {};
    const rows = []; let gainSum = 0, leaveSum = 0;
    const [ky, km] = k.split('-').map(Number);
    const dm = doneMap[k] || {};
    for (let d = 1; d <= n; d++) {
      const rowDate = new Date(ky, km - 1, d); rowDate.setHours(0, 0, 0, 0);
      if ((today0 - rowDate) / 86400000 > 30) continue;   // 距今天 30 天外的行不显示
      const r = days[d]; if (!r) continue;
      const h = hoursOf(k, d);
      const lv = +r.leaveH || 0;
      if (h > 0) {
        const info = dm[d];
        const used = info ? info.used : 0;           // 已被换休核销的部分
        const done = info && used >= h - 0.001;       // 全额核销
        const partial = info && used > 0.001 && used < h - 0.001; // 部分核销
        rows.push({ d, kind: 'ot', h, rsn: r.reason || '', done, partial, used });
        gainSum += h;
      }
      else if (lv > 0) { rows.push({ d, kind: 'lv', h: lv, rsn: r.leaveReason || r.reason || '' }); leaveSum += lv; }
    }
    rows.sort((a, b) => a.d - b.d);
    return { k, rows, gainSum, leaveSum };
  });
  const html = blocks.map(b => {
    const [y, m] = b.k.split('-').map(Number);
    let sub = `加班 ${hf(b.gainSum)}h`;
    if (b.leaveSum > 0) sub += ` · 换休 ${hf(b.leaveSum)}h`;
    const inner = !b.rows.length
      ? `<div class="lv-row empty">（本月暂无加班 / 换休记录）</div>`
      : b.rows.map(row => {
        const wd = WD[new Date(y, m - 1, row.d).getDay()];
        const tag = row.kind === 'ot' ? '加班' : '换休';
        const doneCls = row.kind === 'ot' && row.done ? ' done' : (row.kind === 'ot' && row.partial ? ' partial' : '');
        let doneTag = '';
        if (row.kind === 'ot' && row.done) doneTag = '<span class="donetag">已结转</span>';
        else if (row.kind === 'ot' && row.partial) doneTag = `<span class="donetag">已结转 ${hf(row.used)}/${hf(row.h)}h</span>`;
        return `<div class="lv-row ${row.kind}${doneCls}">
          <span class="d">${m}/${pad(row.d)}</span>
          <span class="w">周${wd}</span>
          <span class="h">${tag} ${hf(row.h)}h</span>
          <span class="rsn">${esc(row.rsn || (row.kind === 'ot' ? '（未填事由）' : '调休'))}</span>${doneTag}
        </div>`;
      }).join('');
    return `<div class="lv-month">
      <div class="lv-month-hd"><span class="dot"></span>${y}年${m}月<span class="sub">${sub}</span></div>
      <div class="lv-list">${inner}</div>
    </div>`;
  }).join('');
  return `<div class="lv-detail">
    <div class="lv-detail-hd">
      <b>📋 可调休 ${hf(c.availTotal)}h 来源明细</b>
      <span class="meta">将于 ${expLbl} 到期 · 按 FIFO 消耗</span>
    </div>
    ${html}
    <div class="lv-ft">💡 剩余 ${hf(c.availTotal)}h 由 ${oy}年${om}月 起的加班累计扣除换休后跨月结转形成；系统按时间从远到近使用，先到期先消耗。</div>
  </div>`;
}

function renderBody() {

/* 若当前月份包含今天，自动滚动让当天行/单元格进入视口 */
function scrollToToday() {
  const now = new Date(), nowK = mk(now.getFullYear(), now.getMonth() + 1);
  if (nowK !== cur) return;
  const d = now.getDate();
  requestAnimationFrame(() => {
    const row = document.querySelector(`#dtb tr.today`);
    if (row && row.scrollIntoView) { row.scrollIntoView({ block: 'center' }); return; }
    const cel = document.querySelector(`.cel.today`);
    if (cel && cel.scrollIntoView) cel.scrollIntoView({ block: 'center' });
  });
}

/* ------------------------- 日历视图 ------------------------- */
function viewCal() {
  const [y, m] = cur.split('-').map(Number), n = daysIn(cur);
  const first = new Date(y, m - 1, 1).getDay();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cel pad"></div>';
  for (let d = 1; d <= n; d++) {
    const t = dayType(cur, d), r = M(cur).days[d] || {}, h = hoursOf(cur, d);
    const T = TYPES.find(x => x.k === t);
    const bits = [];
    if (h > 0) bits.push(`<span class="pill ot ${T.cls}">加 ${hf(h)}h</span>`);
    if (+r.leaveH) bits.push(`<span class="pill lv">休 ${hf(+r.leaveH)}h</span>`);
    if (+r.annual) bits.push(`<span class="pill an">年假 ${hf(+r.annual)}</span>`);
    if (+r.outing) bits.push(`<span class="pill ot">外出</span>`);
    cells += `<div class="cel ${t}${isToday(cur, d) ? ' today' : ''}" data-d="${d}">
        <div class="dn"><span>${d}</span>${t !== 'work' ? `<span class="tag ${T.cls}">${T.name}</span>` : (r.type ? '<span class="tag w">工作日</span>' : '')}</div>
        <div class="bar">${bits.join('')}</div>
        ${(r.reason || r.leaveReason) ? `<div class="rsn">${esc(r.reason || r.leaveReason)}</div>` : ''}
        <div class="mk">${+r.meal ? '<i title="餐补">🍚</i>' : ''}${r.oa ? '<i title="OA 已提交">✅</i>' : ''}</div>
      </div>`;
  }
  const c = compute(cur);
  return `<div class="cols">
    <div class="card">
      <div class="card-h"><h3>${cur.replace('-', ' 年 ')} 月</h3><span class="sub">仅展示统计 · 录入请切换到「明细」</span>
        <span class="spacer"></span>
        <span class="lg" style="padding:0"><span><i style="background:#3b6bff"></i>工作日</span><span><i style="background:#f5a524"></i>双休日</span><span><i style="background:#e5484d"></i>节假日</span></span>
      </div>
      <div class="cal">
        <div class="cal-hd">${WD.map((w, i) => `<div class="${i === 0 || i === 6 ? 'we' : ''}">周${w}</div>`).join('')}</div>
        <div class="cal-bd" id="calbd">${cells}</div>
      </div>
    </div>
    ${panel(c)}
  </div>`;
}

        ${c.leaveShort > 0 ? `<div style="margin-top:10px;font-size:12px;color:#c0393d;background:#fef2f2;padding:8px 10px;border-radius:8px">⚠️ 换休比可用加班时长多 ${hf(c.leaveShort)} 小时，请核对。</div>` : ''}
        ${c.lvExpired && c.lvExpiredCash > 0 ? `<div style="margin-top:10px;font-size:12px;color:#c0393b;background:#fef2f2;padding:8px 10px;border-radius:8px">⌛ 调休已过期，未休完的 <b>${hf(c.lvExpiredCash)}h</b> 已自动折现计入本月加班费。</div>` : ''}
        ${(() => { const bs = leaveBreakdown(cur); return bs ? `<div style="margin-top:10px;font-size:12px;color:#5b6478;background:#f6f8fc;border:1px dashed #d7deea;padding:8px 10px;border-radius:8px;cursor:pointer" onclick="openMonthSettle('${cur}')" role="button" tabindex="0" title="点击打开本月加班结算（加班费 / 结转下月 / 换休核销）"><b>调休对应：</b>${bs}<span style="color:var(--brand);margin-left:6px;white-space:nowrap">查看核销 ▸</span></div>` : ''; })()}
      </div>
    </div>
    ${otCard(c)}
  </div>`;
}
